name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read  # Required to checkout code

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (service)
        working-directory: benchmesh-serial-service
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Run backend tests
        run: |
          python -m pytest -q -m "not integration" benchmesh-serial-service/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmesh-serial-service/frontend/package.json

      - name: Install frontend dependencies
        working-directory: benchmesh-serial-service/frontend
        run: |
          npm ci

      - name: Run frontend unit tests
        working-directory: benchmesh-serial-service/frontend
        run: |
          npx vitest run --reporter=dot

      - name: Run Node-RED node tests
        run: node --test "node-red-contrib-benchmesh/test/*.test.js"

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests (incl. device definitions vs. wire captures)
        run: cargo test

      - name: Validate device definitions
        run: cargo run -q -p bm-devicedef -- validate devices

  # Port discovery has Windows (SetupAPI) and macOS (IORegistry) code: build, lint and test the
  # transport crate natively there, and run the real enumeration once (no instruments attached).
  transport-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (bm-transport)
        run: cargo clippy -p bm-transport --all-targets -- -D warnings

      - name: Tests (bm-transport)
        run: cargo test -p bm-transport

      - name: Enumerate ports
        run: cargo run -q -p bm-transport --example ports
