name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read  # Required to checkout code

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (incl. no em/en dashes in the repository)
        run: npx vitest run --reporter=dot

      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests (incl. device definitions vs. wire captures)
        run: cargo test

      - name: Validate device definitions
        run: cargo run -q -p bm-devicedef -- validate devices

  # Port discovery has Windows (SetupAPI) and macOS (IORegistry) code: build, lint and test the
  # transport crate natively there, and run the real enumeration once (no instruments attached).
  transport-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (bm-transport)
        run: cargo clippy -p bm-transport --all-targets -- -D warnings

      - name: Tests (bm-transport)
        run: cargo test -p bm-transport

      - name: Enumerate ports
        run: cargo run -q -p bm-transport --example ports
