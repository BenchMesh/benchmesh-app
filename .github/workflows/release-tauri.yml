name: Release BenchMesh (Tauri)

# Builds the self-contained desktop app (Rust + Tauri, no Python/Node runtime needed)
# for Linux, Windows and macOS and attaches the installers to a DRAFT GitHub release.
# Review the draft, then publish it manually.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual draft build (e.g. 0.1.0)'
        required: true
        default: '0.0.0'

permissions:
  contents: write  # create the draft release and upload installers

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust lint + tests (incl. capture replay)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo run -q -p bm-devicedef -- validate devices
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmesh-serial-service/frontend/package-lock.json
      - name: Frontend tests
        working-directory: benchmesh-serial-service/frontend
        run: |
          npm ci
          npx vitest run --reporter=dot
      - name: Node-RED node tests
        run: node --test "node-red-contrib-benchmesh/test/*.test.js"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: '--bundles deb,appimage'
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust_target: aarch64-apple-darwin
          - os: macos-13
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust_target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmesh-serial-service/frontend/package-lock.json
      - name: Build the UI (bundled into the app)
        working-directory: benchmesh-serial-service/frontend
        run: |
          npm ci
          npm run build

      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          node -e "const f='crates/benchmesh-app/tauri.conf.json';const c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$V"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/benchmesh-app
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          releaseName: 'BenchMesh v__VERSION__'
          releaseBody: |
            BenchMesh desktop app — Rust backend + Tauri. Self-contained: no Python or Node.js installation required.

            - Linux: `.deb` or `.AppImage`
            - Windows: `-setup.exe`
            - macOS: `.dmg` (Apple Silicon `aarch64`, Intel `x64`)

            User data stays in `~/.benchmesh` (config.yaml, recordings.db).
          releaseDraft: true
          prerelease: false
