[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop app needs WebKitGTK etc.; build it explicitly (`-p benchmesh-app` / `cargo tauri build`).
default-members = ["crates/bm-devicedef", "crates/bm-driver", "crates/bm-transport", "crates/bm-probe", "crates/bm-server", "crates/bm-store"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"
regex = "1"
cel = { version = "0.15", default-features = false }
flate2 = "1"
serialport = { version = "4.10", default-features = false }
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
