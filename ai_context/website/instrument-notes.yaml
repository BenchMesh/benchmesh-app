# Per-family notes for the public instrument list (online service / website).
# Collected 2026-10-18 from the interface sweep, the coverage research and the library
# inventory (ai_context/migration/coverage/*.md). One entry per definition id; kinds:
#   partial_interface   — only some models of the family have this interface
#   unsupported         — an interface the instrument has that BenchMesh cannot use (yet)
#   unverified          — a port / USB id / reply not taken from the manual: confirm on first contact
#   prefer              — which interface works better, and why
#   known_issue         — reported by users / libraries (firmware, timing, quirks)
# The website shows these next to each model's status (Bench-tested / Community-confirmed /
# Awaiting confirmation); a user's first-contact report can resolve `unverified` items.
schema: benchmesh.notes/v1
updated: 2026-10-18
families:
  rigol_dho800:
    - {kind: unverified, text: "LAN socket port 5555 is not stated in the DHO800/900 guide (community: pydho800; Rigol's usual port)."}
    - {kind: known_issue, text: "Screenshot (:DISPlay:DATA? PNG) over the Linux kernel USBTMC driver crashed a DHO804; screenshots are disabled."}
