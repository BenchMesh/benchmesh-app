[tool.poetry]
name = "benchmesh-serial-service"
version = "0.0.51"
description = "A service to manage multiple serial connections for various devices."
authors = ["MarkoV <marek.kaszewski@googlemail.com>"]
license = "MIT"

packages = [
  { include = "benchmesh_service", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10"
pyserial = "^3.5"
pydantic = "^2.0"
pyyaml = "^6.0.3"
fastapi = ">=0.111.0"
uvicorn = {version = ">=0.30.0", extras=["standard"]}
httpx = ">=0.24"
sqlalchemy = ">=2.0.0"
websockets = ">=12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Pragmatic gate for an existing codebase: correctness rules on, style noise off.
# E4/E7/E9 = import/statement/runtime errors, F = pyflakes (catches `is "ON"`-class
# bugs via F632), B = bugbear correctness subset.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E722", # bare except: pre-existing in serial paths; tracked for the Rust port
  "B008", # function call in default arg: FastAPI Depends()/Path()/Query() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
