# Capture-only config for the 2026-10-16 bench (does not replace ~/.benchmesh/config.yaml).
# Serial adapters by stable path. The SPM and XDM both use CH340 adapters WITHOUT a serial
# number, so their shared by-id link is ambiguous: both are addressed by USB port (by-path).
version: 1
devices:
- {id: tenma-72-2540, name: Tenma, driver: tenma_72, model: 72-2540, transport: serial,
   port: /dev/serial/by-id/usb-Nuvoton_USB_Virtual_COM_A02014090305-if00, baud: 9600, serial: 8N1}
- {id: owon-spm3103, name: OWON SPM, driver: owon_spm, model: SPM3103, transport: serial,
   port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.3.2.4:1.0-port0, baud: 115200, serial: 8N1}
- {id: owon-xdm1241, name: OWON XDM, driver: owon_xdm, model: XDM1241, transport: serial,
   port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.3.2.2.4:1.0-port0, baud: 115200, serial: 8N1}
- {id: owon-oel1515, name: OWON OEL, driver: owon_oel, model: OEL1515, transport: serial,
   port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AL036DJT-if00-port0, baud: 115200, serial: 8N1}
- {id: owon-dge2070, name: OWON DGE, driver: owon_dge, model: DGE2070, transport: usbtmc, device: /dev/usbtmc2}
- {id: rigol-dho804, name: Rigol DHO804, driver: rigol_dho800, model: DHO804, transport: usbtmc, device: /dev/usbtmc3}
