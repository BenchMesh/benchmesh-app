# Setter scenario for the 2026-10-16 bench (all instruments disconnected from any load/source,
# confirmed safe by the user). Every block ends by restoring the state observed in the
# read-only capture (captures/20261016-201609).
# Prerequisite: OEL already in remote mode (SYST:REM sent directly) so the Python service can poll it.

# --- Tenma 72-2540 (restore: VSET 4.94, ISET 0.988, output OFF) ---
