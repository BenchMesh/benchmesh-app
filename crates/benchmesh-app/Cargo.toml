[package]
name = "benchmesh-app"
description = "BenchMesh desktop app (Tauri): embedded bm-server + webview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "benchmesh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
benchmesh-extensions = { path = "../benchmesh-extensions" }
bm-server = { path = "../bm-server" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tokio.workspace = true

# frame_sync.rs: GTK windows on X11 do not wait for the compositor (frozen window under GNOME 42)
[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
