[package]
name = "bm-server"
description = "BenchMesh HTTP/WebSocket API server (wire-compatible with the former Python service)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "benchmesh-server"
path = "src/main.rs"

[dependencies]
bm-devicedef = { path = "../bm-devicedef" }
bm-driver = { path = "../bm-driver" }
bm-transport = { path = "../bm-transport" }
bm-store = { path = "../bm-store" }
chrono.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower = "0.5"
serde_json.workspace = true
serde.workspace = true
cel.workspace = true
serde_yaml_ng.workspace = true
regex.workspace = true
# community status from the website (rustls/ring, the TLS stack of remote access too)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
if-addrs = "0.15.0"
ring = "0.17.14"
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk", "component"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
bm-store = { path = "../bm-store" }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
tokio = { workspace = true, features = ["io-util"] }
futures-util = "0.3"
