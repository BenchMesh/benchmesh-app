[package]
name = "bm-server"
description = "BenchMesh HTTP/WebSocket API server (wire-compatible with the former Python service)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "benchmesh-server"
path = "src/main.rs"

[dependencies]
bm-devicedef = { path = "../bm-devicedef" }
bm-driver = { path = "../bm-driver" }
bm-transport = { path = "../bm-transport" }
bm-store = { path = "../bm-store" }
chrono.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower = "0.5"
serde_json.workspace = true
serde_yaml_ng.workspace = true
regex.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
bm-store = { path = "../bm-store" }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
