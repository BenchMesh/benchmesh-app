<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BenchMesh - sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: #101418; color: #e6e9ec; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 360px; background: #171c22; border: 1px solid #2a323b; border-radius: 10px; padding: 28px 24px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header svg { width: 40px; height: 40px; flex: none; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  p { margin: 0 0 16px; color: #9aa4ae; font-size: 13px; }
  label { display: block; font-size: 13px; color: #c3cad1; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #36404a; background: #0d1115; color: inherit; font: inherit; }
  input:focus { outline: 2px solid #ffb648; outline-offset: 1px; }
  button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #ffb648; color: #1a1205; font: inherit; font-weight: 600; cursor: pointer; }
  .message { min-height: 1.4em; margin: 12px 0 0; color: #ff7a6b; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>{{logo}}<h1>BenchMesh</h1></header>
  <p>Remote access to the instruments of this bench. Enter the password set in the BenchMesh app.</p>
  <form method="post" action="/remote/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="message" role="alert">{{message}}</p>
</main>
</body>
</html>
