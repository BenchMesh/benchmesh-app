[package]
name = "bm-transport"
description = "BenchMesh physical transports (serial, Linux USBTMC) implementing bm_driver::engine::Transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bm-devicedef = { path = "../bm-devicedef" }
bm-driver = { path = "../bm-driver" }
serialport.workspace = true
serde.workspace = true
nusb = "0.2"
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys = "0.4"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
serde_json.workspace = true
