# HP / Agilent 34401A bench multimeter over RS-232. Written from the User's Guide
# (ai_context/migration/coverage/DMM.md §3.6) before anyone tested it: the model awaits
# confirmation. GPIB is not offered (no GPIB link in BenchMesh).
schema: benchmesh.device/v1
id: agilent_34401a
extends: scpi_dmm
vendor: HP / Agilent
family: 34401A digital multimeter
version: 0.1.0
sources:
  - {doc: "HP 34401A User's Guide", pages: "59, 90, 94, 106-121, 148-153, 159"}
  - {doc: "Migrating 34401A RS-232 programs to the 34461A (5992-1455)"}
  - {note: "RS-232: DTE DB-9, 300-9600 baud, 2 stop bits fixed; None/8 (p.148) or Even/7 (p.94 says factory Even/7: the manual contradicts itself - use 7E2 in the config `serial` if 8N2 garbles). DTR/DSR handshake: the meter only sends while DSR (its pin 6) is asserted - a null-modem cable with DTR of the PC to DSR of the meter and dtr high, or tie DSR high (p.151). SYST:REM is required before any RS-232 I/O (p.111)"}
models:
  - name: 34401A
    match: "(?i)^(hewlett-packard|agilent technologies|keysight technologies),34401A,"
    note: "A Truevolt set to SYST:IDEN HP34401A answers like this too (compatible)"
link:
  usbtmc: null
  tcp: null
  serial: {baud: 9600, format: 8N2, flow: none, dtr: high, rts: high, settle_ms: 100}
framing:
  tx: {terminator: "\n"}
  # RS-232 readings end <cr><nl> (p.159); an AC reading takes ~1 s at slow filter
  rx: {mode: terminator, terminator: "\n", strip_trailing: "\r", timeout_ms: 3000, drain_idle_ms: 100}
  timing: {min_gap_ms: 20, gap_after_write_ms: 50}
session:
  on_connect: [remote_on]
  on_disconnect: [remote_off]
commands:
  remote_on: {send: "SYST:REM", reply: none, safety: configure, source: "p.111 SYSTem:REMote (required on RS-232)"}
  remote_off: {send: "SYST:LOC", reply: none, safety: configure, source: "p.111 SYSTem:LOCal"}
  func: {source: "p.106 FUNCtion? (quoted short form)"}
  meas: {source: "p.119-121 READ?; overload 9.90000000E+37 p.61, p.131"}
  mode_set:
    params:
      mode:
        type: enum
        # no AUTO keyword on the 34401A: CONF without arguments = autorange
        values: {VOLT: "CONF:VOLT:DC", VOLT_AC: "CONF:VOLT:AC", CURR: "CONF:CURR:DC", CURR_AC: "CONF:CURR:AC",
                 RES: "CONF:RES", FRES: "CONF:FRES", FREQ: "CONF:FREQ", PER: "CONF:PER", CONT: "CONF:CONT",
                 DIOD: "CONF:DIOD", CAP: null, TEMP: null}
    gap_after_ms: 500
    source: "p.119 CONFigure:<function> {<range>|MIN|MAX|DEF},{<resolution>}"
  rng_q: {source: "p.106 <fn>:RANGe?"}
  auto_q: {source: "p.106 <fn>:RANGe:AUTO? → 0|1"}
  nplc_q: {source: "p.59 <fn>:NPLCycles {0.02|0.2|1|10|100}"}
  rate_set: {source: "p.59 <fn>:NPLCycles {0.02|0.2|1|10|100}"}
  range_set:
    params:
      range:
        type: enum
        values: {"0.01": " 0.01", "0.1": " 0.1", "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750",
                 "1000": " 1000", "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6",
                 "100000000": " 100E6"}
    source: "p.106 <fn>:RANGe <range> / :RANGe:AUTO ON"
  temp_scale_set: null
classes:
  DMM:
    features:
      modes: {CAP: null, TEMP: null}
      rate: [{value: "0.02", display: "0.02 PLC (fast)"}, {value: "0.2", display: "0.2 PLC"}, {value: "1", display: "1 PLC"}, {value: "10", display: "10 PLC (default)"}, {value: "100", display: "100 PLC (slow)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
    operations:
      temp_scale: null
