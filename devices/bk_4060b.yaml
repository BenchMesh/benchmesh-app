# BK Precision 4060B series function/arbitrary waveform generators (4062B/4063B/4064B), Siglent
# SDG dialect. Written from the programming manual before anyone tested it on hardware.
# Research: ai_context/migration/coverage/AWG.md §2.2. Pages are printed pages.
schema: benchmesh.device/v1
id: bk_4060b
extends: siglent_sdg
vendor: BK Precision
family: 4060B series function/arbitrary waveform generator
version: 0.1.0
sources:
  - {doc: "4060B Series Programming Manual (4060B_Series_programming_manual.pdf)", pages: "8 (*IDN?), 9 (OUTPut), 11-12 (BSWV)"}
  - {note: "Sine limits 40/80/120 MHz, square 25 MHz (research report §2.2; no datasheet stored). USB ids and LAN port not documented."}
models:
  - {"name": "4064B", "match": "^(\\*IDN )?(BK Precision|BK),\\s*4064B\\s*,", "features": {"AWG": {"max_freq_hz": {"SIN": 120e6, "SQU": 25e6}}}}
  - {"name": "4063B", "match": "^(\\*IDN )?(BK Precision|BK),\\s*4063B\\s*,", "features": {"AWG": {"max_freq_hz": {"SIN": 80e6, "SQU": 25e6}}}}
  - {"name": "4062B", "match": "^(\\*IDN )?(BK Precision|BK),\\s*4062B\\s*,", "features": {"AWG": {"max_freq_hz": {"SIN": 40e6, "SQU": 25e6}}}}
link:
  usbtmc: {}
commands:
  idn: {source: "PM p8: BK,4063B,*********,2.01.01.35R3B2"}
  outp_q: {source: "PM p9: C1:OUTP OFF,LOAD,75,PLRT,NOR"}
  load_q: {source: "PM p9"}
  outp_set: {source: "PM p9"}
  freq_set:
    params: {hz: {type: number, min: 0.000001, max: 120000000, format: "%.6f", unit: Hz}}
classes:
  AWG:
    features: {"max_freq_hz": {"SIN": 120e6, "SQU": 25e6}}
