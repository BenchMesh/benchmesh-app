schema: benchmesh.class/v1
class: ELL
description: >
  DC electronic load. Setpoint GET/POST use the lowercase MODE key as the
  operation name (curr, volt, res, pow) and plain numbers (UI parseFloat).
status:
  VIN:    {type: si, required: true, description: "Measured input voltage (V)"}
  IIN:    {type: si, required: true, description: "Measured input current (A)"}
  PIN:    {type: si, required: true, description: "Measured input power (W)"}
  INPUT:  {type: enum, values: [ON, OFF], required: true}
  MODE:   {type: string, required: true, description: "Active mode (features.modes key, e.g. CURR)"}
  REMOTE: {type: enum, values: [ON, OFF], required: true}
  OVP:    {type: bool, description: "Over-voltage protection tripped"}
  OCP:    {type: bool, description: "Over-current protection tripped"}
  OPP:    {type: bool, description: "Over-power protection tripped"}
operations:
  mode:   {set: true, value: string, required: [set]}
  input:  {get: true, set: true, value: enum, values: [ON, OFF], required: [get, set]}
  remote: {get: true, set: true, value: enum, values: [ON, OFF], required: [get, set]}
  curr:   {get: true, set: true, value: number, description: "CC setpoint (A)"}
  volt:   {get: true, set: true, value: number, description: "CV setpoint (V)"}
  res:    {get: true, set: true, value: number, description: "CR setpoint (ohm)"}
  pow:    {get: true, set: true, value: number, description: "CP setpoint (W)"}
  short:  {get: true, set: true, value: enum, values: [ON, OFF]}
  remote_compensation: {set: true, value: enum, values: [ON, OFF], description: "Remote voltage sense"}
