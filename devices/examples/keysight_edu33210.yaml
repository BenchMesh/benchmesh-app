  - {send: ':SOUR[12]:VOLT\?', reply: "+1.00000000000000E-01", source: "PDF p87 (default 100 mVpp)"}
  - {send: ':SOUR[12]:VOLT:OFFS\?', reply: "+0.00000000000000E+00", source: "PDF p87"}
  - {send: ':SOUR[12]:PHAS\?', reply: "+0.00000000000000E+00", source: "Trueform"}
