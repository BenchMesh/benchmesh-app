# Replies as the XDG SCPI protocol shows them (printed pages; reply formats NR1/NR3 per the
# "Returns" lines): checks the definition through the real engine without hardware.
definition: owon_xdg
transport: usbtmc
model: XDG3202
replies:
  - {send: '\*IDN\?', reply: "OWON,XDG3202,1837001,SCPI:99.0 FV:V1.2.0", source: "p10"}
  - {send: 'OUTPut[12]:STATe\?', reply: "1", source: "p13 (<NR1>)"}
  - {send: 'SOURce[12]:FUNCtion:SHAPe\?', reply: "SIN", source: "p39"}
  - {send: 'SOURce[12]:FREQuency\?', reply: "5.000000E+05", source: "p30 (500 kHz example)"}
  - {send: 'SOURce[12]:VOLTage\?', reply: "1.000E+00", source: "p60 (1 Vpp example)"}
  - {send: 'SOURce[12]:VOLTage:OFFSet\?', reply: "0.000E+00", source: "p60"}
  - {send: 'SOURce[12]:PHASe\?', reply: "3.141593E+00", source: "p45 (radians)"}
  - {send: 'SOURce[12]:FUNCtion:RAMP:SYMMetry\?', reply: "80.5", source: "p39 (80.5 % example)"}
  - {send: 'OUTPut[12]:IMPedance\?', reply: "9.9E+37", source: "p12 (INFinity)"}
expect:
  AWG:
    1: {OUTPUT: "ON", SHAPE: "SIN", FREQ: 500000.0, AMPL: 1.0, OFFS: 0.0, SYMM: 80.5, LOAD: "HIGHZ"}
