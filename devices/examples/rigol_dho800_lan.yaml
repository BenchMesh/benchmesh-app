    1: {DISPLAY: "ON", SCALE: 1.0, OFFSET: 0.01, COUPLING: "AC", BWLIMIT: "20M", INVERT: "ON", PROBE: 10, TIMEBASE: 2.0e-4, TRIG_SWEEP: "SING", TRIG_SOURCE: "CHAN1", TRIG_SLOPE: "NEG", TRIG_LEVEL: 0.16, ACQ_TYPE: "AVER", SRATE: 2.0e9, TRIG_STATUS: "TD", WAVE: [122, 127, 144, 160, 122, 96, 80, 122], WAVE_Y0: 122, WAVE_DY: 0.4132813, WAVE_X0: -0.003, WAVE_DX: 1.0e-9, VPP: 3.12, FREQ: null}
