  - {send: ':ACQuire:SRATe\?', reply: "2.000000e+09", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
  - {send: ':WAVeform:PREamble\?', reply: "0,2,6000000,1,1.000000e-09,-3.000000e-03,0,4.132813e-01,0,122", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
  - {send: ':WAVeform:DATA\?', reply: "#9000000008\x7a\x7f\x90\xa0\x7a\x60\x50\x7a\n", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
