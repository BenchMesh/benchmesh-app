# LAN check of the bench-tested DHO804 definition: the reply formats of the USB TMC captures, framed
# as a raw socket delivers them (line feed after every reply, blocks included).
definition: rigol_dho800
transport: tcpip
model: DHO804
replies:
  - {send: '\*IDN\?', reply: "RIGOL TECHNOLOGIES,DHO804,DHO8A272907001,00.01.03", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
