  - {send: ':CHANnel[1-4]:SCALe\?', reply: "1.000000e+00", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
  - {send: ':CHANnel[1-4]:OFFSet\?', reply: "1.000000e-02", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
  - {send: ':CHANnel[1-4]:COUPling\?', reply: "AC", source: "same reply formats as the DS1000Z guide (shared dialect) and the DHO804 USB TMC captures"}
