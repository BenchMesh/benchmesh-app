# LAN check of siglent_sdg1000x (raw SCPI socket 5025): the replies of
# devices/examples/siglent_sdg1000x.yaml, framed as a socket delivers them (line feed after every
# reply). Spec: ai_context/migration/coverage/README.md.
definition: siglent_sdg1000x
transport: tcpip
model: SDG1062X Plus
replies:
  - {send: '\*IDN\?', reply: "Siglent Technologies,SDG1062X Plus,SDG1XPLUS00041,V1P.1.1.1.40", source: "SDG1000X Plus PG §3.1.1"}
  - {send: 'C[12]:OUTP\?', reply: "C1:OUTP ON,LOAD,HZ,PLRT,NOR", source: "PG p15-16, p17-19 (printed)"}
  - {send: 'C[12]:BSWV\?', reply: "C1:BSWV WVTP,SINE,FRQ,100HZ,PERI,0.01S,AMP,2V,OFST,0V,HLEV,1V,LLEV,-1V,PHSE,0", source: "PG p15-16, p17-19 (printed)"}
expect:
  AWG:
    1: {OUTPUT: "ON", SHAPE: "SIN", FREQ: 100.0, AMPL: 2.0, OFFS: 0.0, PHASE: 0.0, LOAD: "HIGHZ"}
