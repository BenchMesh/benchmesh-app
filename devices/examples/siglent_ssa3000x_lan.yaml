# LAN (raw socket) check: the replies of siglent_ssa3000x.yaml, framed as the socket delivers them
# (every reply, blocks included, ends with a line feed). Replies from the Siglent SSA3000X Plus /
# SVA1000X programming guide (PG0703P_E02B; printed pages). The guide's *IDN? example omits the X of
# the model name; real units report it. Spec: ai_context/migration/coverage/README.md ("Manual
# examples").
definition: siglent_ssa3000x
transport: tcpip
model: SVA1015X
replies:
  - {send: '\*IDN\?', reply: "Siglent,SVA1015X,1234567890,100.01.01.06.01", source: "E02B p13 (Siglent,SVA1015,…)"}
  - {send: ':SENSe:FREQuency:CENTer\?', reply: "1.000000000e+08", source: "E02B p27"}
  - {send: ':SENSe:FREQuency:SPAN\?', reply: "2.000000000e+07", source: "E02B p27"}
  - {send: ':SENSe:FREQuency:STARt\?', reply: "9.000000000e+07", source: "E02B p26"}
  - {send: ':SENSe:FREQuency:STOP\?', reply: "1.100000000e+08", source: "E02B p26"}
  - {send: ':SENSe:BWIDth:RESolution\?', reply: "3.000000e+04", source: "E02B p39"}
  - {send: ':SENSe:BWIDth:RESolution:AUTO\?', reply: "1", source: "E02B p39"}
  - {send: ':SENSe:BWIDth:VIDeo\?', reply: "3.000000e+04", source: "E02B p39"}
  - {send: ':SENSe:BWIDth:VIDeo:AUTO\?', reply: "1", source: "E02B p40"}
  - {send: ':DISPlay:WINDow:TRACe:Y:SCALe:RLEVel\?', reply: "0.000000e+00", source: "E02B p29"}
  - {send: ':DISPlay:WINDow:TRACe:Y:SCALe:PDIVision\?', reply: "10", source: "E02B p31"}
  - {send: ':SENSe:POWer:ATTenuation\?', reply: "20", source: "E02B p30"}
  - {send: ':SENSe:POWer:ATTenuation:AUTO\?', reply: "1", source: "E02B p30"}
  - {send: ':SENSe:POWer:GAIN\?', reply: "0", source: "E02B p30"}
  - {send: ':SENSe:DETector:TRACe1:FUNCtion\?', reply: "POSitive", source: "E02B p45"}
  - {send: ':SENSe:SWEep:TIME\?', reply: "6.832000e-02", source: "E02B p35"}
  - {send: ':INITiate:CONTinuous\?', reply: "1", source: "E02B p37"}
  - {send: ':TRACe1:MODE\?', reply: "WRITe", source: "E02B p42"}
  - {send: ':CALCulate:MARKer1:STATe\?', reply: "1", source: "E02B p47"}
  - {send: ':CALCulate:MARKer1:X\?', reply: "100000000", source: "E02B p48 (integer Hz)"}
  - {send: ':CALCulate:MARKer1:Y\?', reply: "-2.531000e+01", source: "E02B p48"}
  - {send: ':TRACe:DATA\? 1', reply: "-8.123400e+01,-7.988100e+01,-6.012300e+01,-2.531000e+01,-5.977100e+01,-8.040200e+01,", source: "E02B p43 (ASCII list, trailing comma)"}
  - {send: ':OUTPut:STATe\?', reply: "0", source: "E02B p85"}
  - {send: ':SOURce:POWer\?', reply: "-1.000000e+01", source: "E02B p85"}
expect:
  SAL:
    1: {CENTER: 100000000, SPAN: 20000000, START: 90000000, RBW: 30000, REF_LEVEL: 0, SCALE: 10, ATTEN: 20, PREAMP: "OFF", DETECTOR: POS, SWEEP_MODE: CONT, TRACE_MODE: WRITE, MARKER: "ON", MARKER_LEVEL: -25.31, POINTS: 6}
