# GW Instek GDM-8341 / GDM-8342 / GDM-8351 bench multimeters. Written from the user manuals
# (ai_context/migration/coverage/DMM.md §3.11) before anyone tested them: awaiting confirmation.
# Own SCPI dialect over devices/bases/scpi_dmm.yaml: CONF:FUNC?, CONF:RANG?, CONF:AUTO?, VAL1?,
# SENS:DET:RATE S|M|F; a bare CONF:<fn> selects autorange.
schema: benchmesh.device/v1
id: gwinstek_gdm8300
extends: scpi_dmm
vendor: GW Instek
family: GDM-8300 series digital multimeter
version: 0.1.0
sources:
  - {doc: "GDM-8342 User Manual EN Ver D (covers 8341/8342)", pages: "103 USB CDC, 110-111 terminators, 117-120 CONFigure, 128-130 DETector:RATE/UNIT, 135 VAL1?, 139-141 SYSTem/*IDN? (printed)"}
  - {doc: "GDM-8351 User Manual EN Ver B1", pages: "94-95 USB TMC/CDC + RS-232, 110-111 CONFigure, 124 DETector:RATE, 128 VAL1?, 136 *IDN? (printed)"}
  - {note: "USB vid 0x2184 from the driver INF; pids 0x001A/0x003B/0x0058 cannot be assigned to models. Remote overload form undocumented (display -OL-): treated like 9.9E37. Commands accept LF/CR/CRLF, replies end CRLF"}
models:
  - name: GDM8342
    match: "(?i)^GW ?Instek,GDM-?8342,"
    note: "USB virtual COM only (p.103); the optional GPIB card is not supported"
  - name: GDM8341
    match: "(?i)^GW ?Instek,GDM-?8341,"
    note: "No temperature function (manual p.62); USB virtual COM only"
  - name: GDM8351
    match: "(?i)^GW ?Instek,GDM-?8351,"
    note: "4-wire Ω; USB selectable TMC or CDC; RS-232"
    features:
      DMM:
        modes:
          FRES: {unit: "Ω", symbol: R, note: 4W, techname: FRES, ui_name: Resistance}
        RANGe:
          VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
          VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
          CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "10", display: "10A"}]
          CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "10", display: "10A"}]
          RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
          FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
          CAP: [{value: AUTO, display: AUTO}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}]
link:
  # USB virtual COM (CDC) or RS-232; 9600-115200 selectable, default 115200 (8342 p.103, p.145)
  serial: {baud: 115200, format: 8N1, flow: none}
  usbtmc: {vid: "2184"}
  tcp: null
commands:
  func:
    send: "CONF:FUNC?"
    parse:
      - trim
      - unquote
      - upper
      - map: {"VOLT": VOLT, "VOLT:AC": VOLT_AC, "VOLT:DCAC": VOLT_DCAC, "CURR": CURR, "CURR:AC": CURR_AC,
              "CURR:DCAC": CURR_DCAC, "RES": RES, "FRES": FRES, "CAP": CAP, "FREQ": FREQ, "PER": PER,
              "CONT": CONT, "DIOD": DIOD, "TEMP": TEMP}
    description: "Unquoted: VOLT, VOLT:AC, VOLT:DCAC, CURR, …"
    source: "8342 p.119 CONFigure:FUNCtion?"
  meas:
    send: "VAL1?"
    # 834x: `+0.333E-4,V DC` (unit after the comma); 8351: number only
    parse: [trim, {split: {sep: ",", index: 0}}, number]
    timeout_ms: 3000
    description: "Latest first-display reading (the meter measures continuously)"
    source: "8342 p.135 VAL1?; 8351 p.128"
  rng_q:
    send: "CONF:RANG?"
    params: {fn: null}
    source: "8342 p.120 CONFigure:RANGe? (e.g. 50E+1 = 500 Ω)"
  auto_q:
    send: "CONF:AUTO?"
    params: {fn: null}
    source: "8342 p.120 CONFigure:AUTO? → 0|1"
  nplc_q:
    send: "SENS:DET:RATE?"
    params: {fn: null}
    parse: [trim, upper, {map: {"SLOW": S, "MID": M, "MEDIUM": M, "FAST": F}}]
    description: "SLOW / MID / FAST"
    source: "8342 p.128 [SENSe:]DETector:RATE?"
  rate_set:
    send: "SENS:DET:RATE {plc}"
    params:
      fn: null
      plc: {type: enum, values: {S: S, M: M, F: F, "0.02": null, "0.2": null, "1": null, "10": null, "100": null}}
    requires: null
    source: "8342 p.128 [SENSe:]DETector:RATE S|M|F (DCV 5/10/40 rdg/s, p.31)"
  mode_set:
    params:
      mode:
        type: enum
        values: {VOLT: "CONF:VOLT:DC", VOLT_AC: "CONF:VOLT:AC", VOLT_DCAC: "CONF:VOLT:DCAC", CURR: "CONF:CURR:DC",
                 CURR_AC: "CONF:CURR:AC", CURR_DCAC: "CONF:CURR:DCAC", RES: "CONF:RES", FRES: "CONF:FRES",
                 CAP: "CONF:CAP", FREQ: "CONF:FREQ", PER: "CONF:PER", CONT: "CONF:CONT", DIOD: "CONF:DIOD",
                 TEMP: "CONF:TEMP:TCO K"}
    invalidates: [func, rng_q, auto_q]
    source: "8342 p.117-119 CONFigure:<function> (no range = autorange); FRES 8351 only"
  range_set:
    send: "{fn}{range}"
    params:
      fn:
        type: enum
        from: func
        values: {VOLT: "CONF:VOLT:DC", VOLT_AC: "CONF:VOLT:AC", VOLT_DCAC: "CONF:VOLT:DCAC", CURR: "CONF:CURR:DC",
                 CURR_AC: "CONF:CURR:AC", CURR_DCAC: "CONF:CURR:DCAC", RES: "CONF:RES", FRES: "CONF:FRES",
                 CAP: "CONF:CAP"}
      # AUTO: the bare CONF:<fn> selects autorange (p.117)
      range:
        type: enum
        values: {AUTO: "", "0.00000001": " 10E-9", "0.000000005": " 5E-9", "0.00000005": " 50E-9", "0.0000001": " 100E-9",
                 "0.0000005": " 500E-9", "0.000001": " 1E-6", "0.000005": " 5E-6", "0.00001": " 10E-6", "0.00005": " 50E-6",
                 "0.0001": " 100E-6", "0.0005": " 500E-6", "0.005": " 5E-3", "0.01": " 10E-3", "0.05": " 50E-3",
                 "0.1": " 0.1", "0.5": " 0.5", "1": " 1", "5": " 5", "10": " 10", "50": " 50", "100": " 100",
                 "500": " 500", "750": " 750", "1000": " 1000", "5000": " 5E3", "10000": " 10E3", "50000": " 50E3",
                 "100000": " 100E3", "500000": " 500E3", "1000000": " 1E6", "5000000": " 5E6", "10000000": " 10E6",
                 "50000000": " 50E6", "100000000": " 100E6"}
    invalidates: [rng_q, auto_q]
    source: "8342 p.117-119 CONFigure:<function> <range> (rounds up to the next range)"
  temp_sensor_set:
    send: "CONF:TEMP:TCO {sensor}"
    params: {sensor: {type: enum, values: {K: K, J: J, T: T}}}
    reply: none
    safety: configure
    invalidates: [func, rng_q, auto_q]
    gap_after_ms: 300
    settle_ms: 800
    source: "8342 p.119 CONFigure:TEMPerature:TCOuple J|K|T"
  temp_scale_set:
    send: "SENS:UNIT {unit}"
    params: {unit: {type: enum, values: {K: null}}}
    source: "8342 p.130 [SENSe:]UNIT C|F"
classes:
  DMM:
    features:
      modes:
        FRES: null
        VOLT_DCAC: {unit: V, symbol: U, note: "DC+AC", techname: "VOLT:DCAC", ui_name: "Voltage DC+AC"}
        CURR_DCAC: {unit: A, symbol: I, note: "DC+AC", techname: "CURR:DCAC", ui_name: "Current DC+AC"}
      rate: [{value: F, display: fast}, {value: M, display: medium}, {value: S, display: slow}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.5", display: "500mV"}, {value: "5", display: "5V"}, {value: "50", display: "50V"}, {value: "500", display: "500V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.5", display: "500mV"}, {value: "5", display: "5V"}, {value: "50", display: "50V"}, {value: "500", display: "500V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.0005", display: "500µA"}, {value: "0.005", display: "5mA"}, {value: "0.05", display: "50mA"}, {value: "0.5", display: "500mA"}, {value: "5", display: "5A"}, {value: "10", display: "10A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.0005", display: "500µA"}, {value: "0.005", display: "5mA"}, {value: "0.05", display: "50mA"}, {value: "0.5", display: "500mA"}, {value: "5", display: "5A"}, {value: "10", display: "10A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "500", display: "500Ω"}, {value: "5000", display: "5kΩ"}, {value: "50000", display: "50kΩ"}, {value: "500000", display: "500kΩ"}, {value: "5000000", display: "5MΩ"}, {value: "50000000", display: "50MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000005", display: "5nF"}, {value: "0.00000005", display: "50nF"}, {value: "0.0000005", display: "500nF"}, {value: "0.000005", display: "5µF"}, {value: "0.00005", display: "50µF"}]
        TEMP:
          Sensor: [{value: K, display: "K thermocouple"}, {value: J, display: "J thermocouple"}, {value: T, display: "T thermocouple"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}]
    operations:
      temp_sensor: {set: temp_sensor_set}
