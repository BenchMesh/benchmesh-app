# GW Instek GDM-9060 / GDM-9061 6½-digit bench multimeters. Written from the user manual
# (ai_context/migration/coverage/DMM.md §3.11) before anyone tested them: awaiting confirmation.
# 34461A-style SCPI → devices/bases/scpi_dmm.yaml.
schema: benchmesh.device/v1
id: gwinstek_gdm9000
extends: scpi_dmm
vendor: GW Instek
family: GDM-906X digital multimeter
version: 0.1.0
sources:
  - {doc: "GDM-906X User Manual EN Ver G (2024-03-18)", pages: "216 RS-232, 224 terminators, 239-246 LAN (TCP port 3001), 246 *IDN?, 274 READ?, 282-285 CONFigure, 294-317 SENSe, 299 NPLC (printed)"}
  - {note: "*IDN? can be changed by the user (SYSTem:IDNStr, p.329): a customised unit is not recognised. USB vid 0x2184 (GW Instek), pid unknown. Remote overload form not printed: treated like 9.9E37"}
models:
  - name: GDM9061
    match: "(?i)^GW ?Instek,GDM-?9061,"
    note: "3 A current terminal"
  - name: GDM9060
    match: "(?i)^GW ?Instek,GDM-?9060,"
link:
  # RS-232 9600-115200, default 115200 (p.216, p.374); CDC/RS-232 reply terminator selectable, default CRLF
  serial: {baud: 115200, format: 8N1, flow: none}
  usbtmc: {vid: "2184"}
  # raw TCP socket, default port 3001 (telnet 3000)
  tcp: {port: 3001}
commands:
  func: {source: "p.295 [SENSe:]FUNCtion? → \"VOLT\", \"VOLT:AC\", … (quoted)"}
  meas: {source: "p.274 READ? → -1.13148354E-04"}
  mode_set:
    params:
      mode:
        type: enum
        values: {TEMP: "CONF:TEMP TCO,K"}
    source: "p.282-285 CONFigure[:VOLTage]:DC [AUTO] …"
  rng_q: {source: "p.300 [SENSe:]VOLTage[:DC]:RANGe?"}
  auto_q: {source: "p.300 [SENSe:]VOLTage[:DC]:RANGe:AUTO? → 0|1"}
  nplc_q:
    parse: [trim, number, {map: {"0.006": "0.006", "0.0083": "0.0083", "0.0125": "0.0125", "0.025": "0.025", "0.05": "0.05",
                                 "0.15": "0.15", "0.6": "0.6", "1.0": "1", "3.0": "3", "12.0": "12", "_": "{raw}"}}]
    source: "p.299 [SENSe:]VOLTage[:DC]:NPLCycles? → 0.006 … 12"
  rate_set:
    params:
      plc: {type: enum, values: {"0.006": "0.006", "0.0083": "0.0083", "0.0125": "0.0125", "0.025": "0.025", "0.05": "0.05",
                                 "0.15": "0.15", "0.6": "0.6", "3": "3", "12": "12", "0.02": null, "0.2": null, "10": null, "100": null}}
    source: "p.299 NPLCycles {0.006|0.0083|0.0125|0.025|0.05|0.15|0.6|1|3|12}"
  range_set:
    params:
      range:
        type: enum
        values: {"0.000000001": " 1E-9", "0.00000001": " 10E-9", "0.0000001": " 100E-9", "0.000001": " 1E-6",
                 "0.00001": " 10E-6", "0.0001": " 100E-6", "0.001": " 1E-3", "0.01": " 10E-3", "0.1": " 0.1",
                 "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750", "1000": " 1000",
                 "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6", "100000000": " 100E6"}
    source: "p.300-310 [SENSe:]<fn>:RANGe <value> / :RANGe:AUTO ON"
  temp_sensor_set:
    send: "CONF:TEMP {sensor}"
    params:
      sensor:
        type: enum
        values: {TC_K: "TCO,K", TC_J: "TCO,J", TC_T: "TCO,T", TC_N: "TCO,N", TC_R: "TCO,R", TC_S: "TCO,S", TC_B: "TCO,B",
                 TC_E: "TCO,E", RTD_PT100: "RTD,PT100", FRTD_PT100: "FRTD,PT100"}
    reply: none
    safety: configure
    invalidates: [func, rng_q, auto_q]
    gap_after_ms: 300
    settle_ms: 800
    source: "p.285 CONFigure:TEMPerature <probe>,<type>"
  temp_scale_set:
    send: "SENS:UNIT {unit}"
    source: "p.295 [SENSe:]UNIT C|F|K"
classes:
  DMM:
    features:
      rate: [{value: "0.006", display: "0.006 PLC (10k rdg/s)"}, {value: "0.0083", display: "0.0083 PLC (7.2k rdg/s)"}, {value: "0.0125", display: "0.0125 PLC (4.8k rdg/s)"}, {value: "0.025", display: "0.025 PLC (2.4k rdg/s)"}, {value: "0.05", display: "0.05 PLC (1.2k rdg/s)"}, {value: "0.15", display: "0.15 PLC (400 rdg/s)"}, {value: "0.6", display: "0.6 PLC (100 rdg/s)"}, {value: "1", display: "1 PLC (60 rdg/s)"}, {value: "3", display: "3 PLC (20 rdg/s)"}, {value: "12", display: "12 PLC (5 rdg/s)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}]
        TEMP:
          Sensor: [{value: TC_K, display: "K thermocouple"}, {value: TC_J, display: "J thermocouple"}, {value: TC_T, display: "T thermocouple"}, {value: TC_N, display: "N thermocouple"}, {value: TC_R, display: "R thermocouple"}, {value: TC_S, display: "S thermocouple"}, {value: TC_B, display: "B thermocouple"}, {value: TC_E, display: "E thermocouple"}, {value: RTD_PT100, display: "PT100 2-wire"}, {value: FRTD_PT100, display: "PT100 4-wire"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
