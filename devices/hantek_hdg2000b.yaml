# Hantek HDG2000B series arbitrary waveform generators (HDG2032B/2062B/2082B/2102B).
# Written from the SCPI protocol document before anyone tested it on hardware.
# Research: ai_context/migration/coverage/AWG.md §2.10. Pages are PDF pages. The document has no
# *IDN? reply example, no amplitude-unit query and no load (output impedance) command.
schema: benchmesh.device/v1
id: hantek_hdg2000b
extends: scpi_awg
vendor: Hantek
family: HDG2000B series arbitrary waveform generator
version: 0.1.0
sources:
  - {doc: "HDG2000B SCPI protocol (HDG2000B_SCPI_protocol_EN.pdf)", pages: "17 (FREQ), 19-20 (FUNC, SQU/RAMP), 26 (OUTPut, PHASe), 40 (VOLTage, OFFSet), 22-23 (*IDN?)"}
  - {doc: "HDG2000B User Manual V1.2", pages: "11 (model table), 38-43 (carrier limits 5.1.3), 92 (USB id USB0::0x049F::0x505B)"}
  - {note: "IDN form undocumented: models match the model number anywhere in the reply"}
models:
  - {"name": "HDG2032B", "match": "HDG2032B", "features": {"AWG": {"max_freq_hz": {"SIN": 30e6}}}}
  - {"name": "HDG2062B", "match": "HDG2062B", "features": {"AWG": {"max_freq_hz": {"SIN": 60e6}}}}
  - {"name": "HDG2082B", "match": "HDG2082B", "features": {"AWG": {"max_freq_hz": {"SIN": 80e6}}}}
  - {"name": "HDG2102B", "match": "HDG2102B", "features": {"AWG": {"max_freq_hz": {"SIN": 100e6, "SQU": 30e6, "PUL": 15e6, "RAMP": 4e6}}}}
link:
  usbtmc: {vid: "049f", pid: "505b"}
commands:
  outp_q: {send: "OUTPut{ch}?", source: "PDF p26; reply ON/OFF"}
  outp_set: {send: "OUTPut{ch} {on}", source: "PDF p26"}
  shape_q: {send: "SOURce{ch}:FUNCtion?", source: "PDF p19; full words (SINusoid, SQUare, …)"}
  shape_set:
    send: "SOURce{ch}:FUNCtion {shape}"
    params: {shape: {type: enum, values: {SIN: SINusoid, SQU: SQUare, RAMP: RAMP, PUL: PULSe, PRN: NOISe, DC: DC}}}
    source: "PDF p19"
  freq_q: {send: "SOURce{ch}:FREQuency?", source: "PDF p17; +1.000000000000000E+03"}
  freq_set:
    send: "SOURce{ch}:FREQuency {hz}"
    params: {hz: {type: number, min: 0.000001, max: 100000000, format: "%.6f", unit: Hz}}
    source: "PDF p17"
  unit_q: null
  ampl_q: {send: "SOURce{ch}:VOLTage?", description: "Vpp", source: "PDF p40"}
  ampl_set:
    send: "SOURce{ch}:VOLTage {vpp}"
    params: {vpp: {type: number, min: 0.002, max: 20, format: "%.4f", unit: Vpp}}
    requires: null
    description: "2 mVpp–20 Vpp; into 50 Ω 10 Vpp ≤20 MHz, 7.5 ≤60 MHz, 5 ≤80 MHz, 1 ≤100 MHz"
    source: "PDF p40"
  offs_q: {send: "SOURce{ch}:VOLTage:OFFSet?", source: "PDF p40"}
  offs_set: {send: "SOURce{ch}:VOLTage:OFFSet {v}", source: "PDF p40; −10 to +10 V"}
  phase_q: {send: "SOURce{ch}:PHASe?", source: "PDF p26"}
  phase_set: {send: "SOURce{ch}:PHASe {deg}", source: "PDF p26; 0 to 360°"}
  symm_q: {send: "SOURce{ch}:FUNCtion:RAMP:SYMMetry?", source: "PDF p20"}
  symm_set: {send: "SOURce{ch}:FUNCtion:RAMP:SYMMetry {pct}", source: "PDF p20"}
  load_q: null
classes:
  AWG:
    features: {"max_freq_hz": {"SIN": 100e6, "SQU": 30e6, "PUL": 15e6, "RAMP": 4e6}}
    poll:
      - every_ms: 1500
        read: [outp_q, shape_q, freq_q, ampl_q, offs_q, phase_q, symm_q]
    status:
      AMPL: {expr: ampl_q, as: si}
      LOAD: null
