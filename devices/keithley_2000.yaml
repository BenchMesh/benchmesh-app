# Keithley 2000 6½-digit bench multimeter over RS-232. Written from the user manual
# (ai_context/migration/coverage/DMM.md §3.12) before anyone tested it: awaiting confirmation.
# SCPI as the scpi_dmm base, with Keithley-2000 differences: RS-232 needs remote mode, the
# function is chosen with :SENS:FUNC (keeps continuous initiation and per-function setup;
# :CONF:<fn> would switch continuous initiation off and leave :FETC? on a stale reading), and
# readings come from :FETC? while the meter measures continuously.
schema: benchmesh.device/v1
id: keithley_2000
extends: scpi_dmm
vendor: Keithley
family: Model 2000 digital multimeter
version: 0.1.0
sources:
  - {doc: "Model 2000 Multimeter User's Manual 2000-900-01 Rev. J (Aug 2010)", pages: "56, 81-86 (RS-232), 122 (*IDN?), 134-136 (:CONF/:FETC?/:READ?), 140-148 (SENSe), 159 (overflow +9.9E37)"}
  - {note: "RS-232: 300-19200 baud, factory 4800, 8N1, flow none or XON/XOFF, commands are executed after <CR>; the meter's TX terminator is a menu item (set LF or LFCR). The RS-232 interface must be selected on the front panel (GPIB is the default). FUNC? reply form not printed (community: quoted long form \"VOLT:DC\")"}
models:
  - name: "2000"
    match: "(?i)^KEITHLEY INSTRUMENTS[^,]*, ?MODEL 2000,"
    note: "Select RS-232 on the front panel (SHIFT RS232: ON) and set TX TERM to LF; GPIB is not supported"
link:
  serial: {baud: 4800, format: 8N1, flow: none, settle_ms: 100}
  usbtmc: null
  tcp: null
framing:
  tx: {terminator: "\r"}
  rx: {mode: terminator, terminator: "\n", skip_leading: "\r", strip_trailing: "\r", timeout_ms: 2000, drain_idle_ms: 100}
  timing: {min_gap_ms: 10, gap_after_write_ms: 50}
session:
  on_connect: [remote_on, format_read, init_cont]
  on_disconnect: [remote_off]
commands:
  remote_on: {send: ":SYST:REM", reply: none, safety: configure, source: "UM p.148 :SYSTem:REMote (RS-232 only)"}
  remote_off: {send: ":SYST:LOC", reply: none, safety: configure, source: "UM p.148 :SYSTem:LOCal"}
  format_read: {send: ":FORM:ELEM READ", reply: none, safety: configure, description: "Reading only, no units/timestamp", source: "UM p.140 :FORMat:ELEMents"}
  init_cont: {send: ":INIT:CONT ON", reply: none, safety: configure, description: "Continuous measuring, so :FETC? returns the latest reading", source: "UM p.134, p.8147 table :INITiate:CONTinuous"}
  func: {source: "UM p.141 [:SENSe[1]]:FUNCtion? (quoted)"}
  meas:
    send: ":FETC?"
    timeout_ms: 2000
    description: "Latest reading (repeats until a new one is available); +9.9E37 = overflow"
    source: "UM p.134-135 :FETCh?, p.159"
  mode_set:
    params:
      mode:
        type: enum
        values: {VOLT: ":SENS:FUNC 'VOLT:DC'", VOLT_AC: ":SENS:FUNC 'VOLT:AC'", CURR: ":SENS:FUNC 'CURR:DC'",
                 CURR_AC: ":SENS:FUNC 'CURR:AC'", RES: ":SENS:FUNC 'RES'", FRES: ":SENS:FUNC 'FRES'",
                 FREQ: ":SENS:FUNC 'FREQ'", PER: ":SENS:FUNC 'PER'", CONT: ":SENS:FUNC 'CONT'",
                 DIOD: ":SENS:FUNC 'DIOD'", TEMP: ":SENS:FUNC 'TEMP'", CAP: null}
    gap_after_ms: 300
    settle_ms: 1200
    description: "Each function remembers its own range/NPLC; readings of the previous function linger briefly"
    source: "UM p.141 [:SENSe[1]]:FUNCtion <name>"
  rng_q:
    params: {fn: {values: {CAP: null}}}
    source: "UM p.142 [:SENSe[1]]:<fn>:RANGe[:UPPer]?"
  auto_q:
    params: {fn: {values: {CAP: null}}}
    source: "UM p.142 [:SENSe[1]]:<fn>:RANGe:AUTO?"
  range_set:
    params:
      fn: {values: {CAP: null}}
      range:
        values: {"0.01": " 0.01", "0.1": " 0.1", "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750",
                 "1000": " 1000", "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6",
                 "100000000": " 100E6"}
    settle_ms: 800
    source: "UM p.142 :RANGe[:UPPer] <n> (0 to 1010 V …), :RANGe:AUTO ON"
  nplc_q:
    parse: [trim, number, {map: {"0.01": "0.01", "0.1": "0.1", "1.0": "1", "10.0": "10", "_": "{raw}"}}]
    source: "UM p.142 :NPLCycles?"
  rate_set:
    params:
      plc: {values: {"0.01": "0.01", "0.1": "0.1", "1": "1", "10": "10", "0.02": null, "0.2": null, "100": null}}
    source: "UM p.142 :NPLCycles <n> 0.01 to 10 (front panel FAST 0.1, MED 1, SLOW 10)"
  temp_sensor_set:
    send: ":SENS:TEMP:TC:TYPE {tc}"
    params: {tc: {type: enum, values: {J: J, K: K, T: T}}}
    reply: none
    safety: configure
    source: "UM p.145 [:SENSe[1]]:TEMPerature:TCouple:TYPE <name>"
  temp_scale_set: {source: "UM p.5-74 :UNIT:TEMPerature C|F|K"}
classes:
  DMM:
    features:
      modes: {CAP: null}
      rate: [{value: "0.01", display: "0.01 PLC (fastest)"}, {value: "0.1", display: "0.1 PLC (fast)"}, {value: "1", display: "1 PLC (medium)"}, {value: "10", display: "10 PLC (slow)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        TEMP:
          Sensor: [{value: K, display: "K thermocouple"}, {value: J, display: "J thermocouple"}, {value: T, display: "T thermocouple"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
