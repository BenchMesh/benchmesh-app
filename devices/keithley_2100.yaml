# Keithley 2100 6½-digit bench multimeter (USBTMC). Written from the User's Manual
# (ai_context/migration/coverage/DMM.md §3.12) before anyone tested it. 34401A-like SCPI →
# devices/bases/scpi_dmm.yaml. No capacitance; temperature is RTD only.
schema: benchmesh.device/v1
id: keithley_2100
extends: scpi_dmm
vendor: Keithley
family: Model 2100 digital multimeter
version: 0.1.0
sources:
  - {doc: "Model 2100 User's Manual 2100-900-01 Rev. F", pages: "33-40 (ranges), 60, 98, 107, 116-120, 138, 144"}
  - {note: "USBTMC 0x05E6:0x2100 (VISA resource strings in the manual's examples). The *IDN? reply is not printed; the Keithley vendor string is assumed. The A34401 language (front panel) answers as a 34401A"}
models:
  - name: "2100"
    match: "(?i)^keithley instruments[^,]*, ?model 2100,"
link:
  usbtmc: {vid: "05e6", pid: "2100"}
  tcp: null
commands:
  func: {source: "p.116 [SENSe:]FUNCtion? (quoted string)"}
  meas: {source: "p.98 READ?; overload 9.90000000E+37 p.107"}
  mode_set:
    params:
      mode:
        type: enum
        # CONF without arguments = autorange (no AUTO keyword in the manual)
        values: {VOLT: "CONF:VOLT:DC", VOLT_AC: "CONF:VOLT:AC", CURR: "CONF:CURR:DC", CURR_AC: "CONF:CURR:AC",
                 RES: "CONF:RES", FRES: "CONF:FRES", FREQ: "CONF:FREQ", PER: "CONF:PER", CONT: "CONF:CONT",
                 DIOD: "CONF:DIOD", TEMP: "CONF:TEMP", CAP: null}
    source: "p.115-116 CONFigure:<function> {<range>|MIN|MAX|DEF},{<resolution>}"
  rng_q: {source: "p.116 [SENSe:]<function>:RANGe?"}
  auto_q: {source: "p.98 <function>:RANGe:AUTO? → 0|1"}
  nplc_q:
    parse: [trim, number, {map: {"0.02": "0.02", "0.1": "0.1", "1.0": "1", "10.0": "10"}}]
    source: "p.60, p.120 <function>:NPLCycles {0.02|0.1|1|10}"
  rate_set:
    params:
      plc: {type: enum, values: {"0.1": "0.1", "0.2": null, "100": null}}
    source: "p.60, p.120 <function>:NPLCycles {0.02|0.1|1|10}"
  range_set:
    params:
      range:
        type: enum
        values: {"0.01": " 0.01", "0.1": " 0.1", "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750",
                 "1000": " 1000", "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6",
                 "100000000": " 100E6"}
    source: "p.116 [SENSe:]<function>:RANGe / :RANGe:AUTO ON"
  temp_scale_set:
    send: "UNIT {unit}"
    params: {unit: {type: enum, values: {C: Cel, F: Far, K: K}}}
    source: "p.60 SENSe:UNIT {Cel|Far|K}"
  temp_sensor_set:
    send: "TEMP:RTD:TYPE {sensor}"
    params: {sensor: {type: enum, values: {PT100: PT100, D100: D100, F100: F100, PT385: PT385, PT3916: PT3916}}}
    reply: none
    safety: configure
    settle_ms: 800
    source: "p.60 SENSe:TEMPerature:RTD:TYPE {PT100|D100|F100|PT385|PT3916|USER|SPRTD}"
classes:
  DMM:
    features:
      modes: {CAP: null}
      rate: [{value: "0.02", display: "0.02 PLC (fast)"}, {value: "0.1", display: "0.1 PLC"}, {value: "1", display: "1 PLC"}, {value: "10", display: "10 PLC (slow)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        TEMP:
          Sensor: [{value: PT100, display: PT100}, {value: D100, display: D100}, {value: F100, display: F100}, {value: PT385, display: PT385}, {value: PT3916, display: PT3916}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
