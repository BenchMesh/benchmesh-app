# Keithley 2110 5½-digit dual-display bench multimeter (USBTMC). Written from the reference
# manual (ai_context/migration/coverage/DMM.md §3.12) before anyone tested it: awaiting
# confirmation. Keysight-style SCPI → scpi_dmm base; the 2110 adds a thermocouple function
# (TCO, mode TEMP_TC) next to RTD temperature (TEMP), and CONF takes no AUTO keyword.
schema: benchmesh.device/v1
id: keithley_2110
extends: scpi_dmm
vendor: Keithley
family: Model 2110 digital multimeter
version: 0.1.0
sources:
  - {doc: "Model 2110 5½ Digit Multimeter Reference Manual 2110-901-01 Rev. C (Aug 2013)", pages: "1-2 (ranges), 5-6 (*IDN?), 5-14 (:CONFigure), 5-26..5-27 (SENSe summary), 5-38 (NPLC), 5-45 (FUNCtion), 5-51 (TCOuple:TYPE), 5-55 (RTD:TYPE), 5-59 (TRANsducer), 5-60 (UNIT), 5-63 (NPLC values)"}
  - {note: "USB product id 0x2110 by analogy with the 2100 (0x2100); not printed in the manual. Overload reading 9.90000000E+37 (error 540 text). FUNC? returns a quoted string; its exact form is not printed"}
models:
  - name: "2110"
    match: "(?i)^KEITHLEY INSTRUMENTS[^,]*,MODEL 2110,"
    note: "In COMPATIBLE mode SYST:IDNS can change the *IDN? reply; keep the default identification"
link:
  usbtmc: {vid: "05e6", pid: "2110"}
  tcp: null
commands:
  idn: {source: "RM p.5-6 *IDN? → KEITHLEY INSTRUMENTS INC.,MODEL 2110,1311126,01.00-01-01"}
  func:
    parse:
      - trim
      - unquote
      - upper
      - map: {"VOLT": VOLT, "VOLT:DC": VOLT, "VOLT:AC": VOLT_AC, "CURR": CURR, "CURR:DC": CURR,
              "CURR:AC": CURR_AC, "RES": RES, "FRES": FRES, "CAP": CAP, "FREQ": FREQ, "FREQ:VOLT": FREQ,
              "PER": PER, "PER:VOLT": PER, "CONT": CONT, "DIOD": DIOD, "TEMP": TEMP, "TCO": TEMP_TC}
    source: "RM p.5-45 FUNCtion? (quoted string)"
  meas: {source: "RM p.5-14 :READ? after :CONFigure"}
  mode_set:
    params:
      mode:
        type: enum
        values: {VOLT: "CONF:VOLT:DC", VOLT_AC: "CONF:VOLT:AC", CURR: "CONF:CURR:DC", CURR_AC: "CONF:CURR:AC",
                 RES: "CONF:RES", FRES: "CONF:FRES", CAP: "CONF:CAP", FREQ: "CONF:FREQ", PER: "CONF:PER",
                 CONT: "CONF:CONT", DIOD: "CONF:DIOD", TEMP: "CONF:TEMP", TEMP_TC: "CONF:TCO"}
    description: "CONF without a range = default (autorange); resets the function's settings and trigger"
    source: "RM p.5-14 :CONFigure:<function> [<range>|MIN|MAX|DEF] (no AUTO keyword)"
  range_set:
    params:
      range:
        values: {"0.000000001": " 1E-9", "0.00000001": " 10E-9", "0.0000001": " 100E-9", "0.000001": " 1E-6",
                 "0.00001": " 10E-6", "0.0001": " 100E-6", "0.001": " 1E-3", "0.01": " 10E-3", "0.1": " 0.1",
                 "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750", "1000": " 1000",
                 "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6", "100000000": " 100E6"}
    source: "RM p.5-26 :RANGe <n>, :RANGe:AUTO <b> (0 = OFF, 1 = ON)"
  rng_q: {source: "RM p.5-26 :RANGe?"}
  auto_q: {source: "RM p.5-26 :RANGe:AUTO?"}
  nplc_q:
    parse: [trim, number, {map: {"0.001": "0.001", "0.006": "0.006", "0.02": "0.02", "0.06": "0.06", "0.2": "0.2",
                                 "0.6": "0.6", "1.0": "1", "2.0": "2", "10.0": "10", "100.0": "100"}}]
    source: "RM p.5-63 VOLTage[:DC]:NPLCycles?"
  rate_set:
    params:
      plc: {values: {"0.006": "0.006", "0.02": "0.02", "1": "1", "10": "10", "100": "100", "0.2": null}}
    source: "RM p.5-38/5-63 NPLCycles 0.001, 0.006, 0.02, 0.06, (0.2, 0.6 DCV only), 1, 2, 10, 100"
  temp_scale_set:
    send: "UNIT {unit}"
    params: {unit: {type: enum, values: {C: Cel, F: Far, K: K}}}
    source: "RM p.5-60 [SENSe:]UNIT Cel|Far|K"
  temp_sensor_set:
    send: "{sensor}"
    params:
      sensor:
        type: enum
        values: {K: 'FUNC "TCO";:TCO:TYPE K', J: 'FUNC "TCO";:TCO:TYPE J', T: 'FUNC "TCO";:TCO:TYPE T',
                 E: 'FUNC "TCO";:TCO:TYPE E', N: 'FUNC "TCO";:TCO:TYPE N', R: 'FUNC "TCO";:TCO:TYPE R',
                 S: 'FUNC "TCO";:TCO:TYPE S', B: 'FUNC "TCO";:TCO:TYPE B', C: 'FUNC "TCO";:TCO:TYPE C',
                 PT100: 'FUNC "TEMP";:TEMP:TRAN RTD;:TEMP:RTD:TYPE PT100',
                 PT100_4W: 'FUNC "TEMP";:TEMP:TRAN FRTD;:TEMP:RTD:TYPE PT100'}
    reply: none
    safety: configure
    invalidates: [func, rng_q, auto_q]
    gap_after_ms: 300
    settle_ms: 800
    description: "Selects the thermocouple (TCO) or RTD (TEMP) function and its sensor type"
    source: "RM p.5-45 FUNCtion, p.5-51 TCOuple:TYPE, p.5-55 TEMPerature:RTD:TYPE, p.5-59 TEMPerature:TRANsducer"
classes:
  DMM:
    features:
      modes:
        TEMP: {unit: "°C", symbol: T, techname: TEMP, ui_name: "Temperature RTD"}
        TEMP_TC: {unit: "°C", symbol: T, techname: TCO, ui_name: "Temperature TC"}
      rate: [{value: "0.006", display: "0.006 PLC (fastest)"}, {value: "0.02", display: "0.02 PLC (fast)"}, {value: "1", display: "1 PLC (medium)"}, {value: "10", display: "10 PLC (slow)"}, {value: "100", display: "100 PLC (slowest)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}, {value: "0.001", display: "1mF"}, {value: "0.01", display: "10mF"}]
        TEMP:
          Sensor: [{value: K, display: "K thermocouple"}, {value: J, display: "J thermocouple"}, {value: T, display: "T thermocouple"}, {value: E, display: "E thermocouple"}, {value: N, display: "N thermocouple"}, {value: R, display: "R thermocouple"}, {value: S, display: "S thermocouple"}, {value: B, display: "B thermocouple"}, {value: C, display: "C thermocouple"}, {value: PT100, display: "PT100 RTD (2-wire)"}, {value: PT100_4W, display: "PT100 RTD (4-wire)"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
