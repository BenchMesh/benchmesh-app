# Keithley DMM6500 6½-digit bench multimeter, SCPI command set only. Written from the reference
# manual (ai_context/migration/coverage/DMM.md §3.12) before anyone tested it: awaiting
# confirmation. The meter also speaks TSP (and SCPI2000/SCPI34401 emulations) selected by
# *LANG with a reboot; this definition needs `*LANG SCPI` (the factory default). SCPI
# differences to the scpi_dmm base: no CONFigure, the function is chosen with :SENS:FUNC.
schema: benchmesh.device/v1
id: keithley_dmm6500
extends: scpi_dmm
vendor: Keithley
family: DMM6500 digital multimeter (SCPI)
version: 0.1.0
sources:
  - {doc: "DMM6500 Reference Manual DMM6500-901-01 Rev. C (April 2026)", pages: "12-11 (:READ?), 12-109..12-111 (:RANGe, :RANGe:AUTO, ranges table, overflow 9.9e+37), NPLCycles, 12-129 (TCouple:TYPE), 12-133 (TRANsducer), 12-134 (UNIT), 12-145 (FUNCtion), *IDN? and *LANG (PDF p.1242, 1254-1255)"}
  - {note: "USB 0x05E6:0x6500 and LAN port 5025 per the report (PDF p.50, 55). FUNC? reply form not printed; mapped for short and long forms"}
models:
  - name: DMM6500
    match: "(?i)^KEITHLEY INSTRUMENTS[^,]*,MODEL DMM6500,"
    note: "Needs the SCPI command set: front panel MENU > System > Settings > Command Set = SCPI (or *LANG SCPI, then reboot). In TSP mode every command fails. 10 A range on the rear terminals only"
link:
  usbtmc: {vid: "05e6", pid: "6500"}
commands:
  idn: {source: "RM *IDN? → KEITHLEY INSTRUMENTS,MODEL DMM6500,04089762,1.6.3d"}
  func:
    parse:
      - trim
      - unquote
      - upper
      - map: {"VOLT": VOLT, "VOLT:DC": VOLT, "VOLT:AC": VOLT_AC, "CURR": CURR, "CURR:DC": CURR,
              "CURR:AC": CURR_AC, "RES": RES, "FRES": FRES, "CAP": CAP, "FREQ": FREQ, "FREQ:VOLT": FREQ,
              "PER": PER, "PER:VOLT": PER, "CONT": CONT, "DIOD": DIOD, "TEMP": TEMP}
    source: "RM p.12-145 [:SENSe[1]]:FUNCtion[:ON]? (NONE while digitizing → MODE unknown)"
  meas: {source: "RM p.12-11 :READ? (last reading of defbuffer1); overflow 9.9e+37 p.12-111"}
  mode_set:
    params:
      mode:
        type: enum
        values: {VOLT: ':SENS:FUNC "VOLT:DC"', VOLT_AC: ':SENS:FUNC "VOLT:AC"', CURR: ':SENS:FUNC "CURR:DC"',
                 CURR_AC: ':SENS:FUNC "CURR:AC"', RES: ':SENS:FUNC "RES"', FRES: ':SENS:FUNC "FRES"',
                 CAP: ':SENS:FUNC "CAP"', FREQ: ':SENS:FUNC "FREQ:VOLT"', PER: ':SENS:FUNC "PER:VOLT"',
                 CONT: ':SENS:FUNC "CONT"', DIOD: ':SENS:FUNC "DIOD"', TEMP: ':SENS:FUNC "TEMP"'}
    description: "Each function keeps its own settings (range, NPLC)"
    source: "RM p.12-145 [:SENSe[1]]:FUNCtion[:ON] \"<function>\""
  range_set:
    params:
      range:
        values: {"0.000000001": " 1E-9", "0.00000001": " 10E-9", "0.0000001": " 100E-9", "0.000001": " 1E-6",
                 "0.00001": " 10E-6", "0.0001": " 100E-6", "0.001": " 1E-3", "0.01": " 10E-3", "0.1": " 0.1",
                 "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750", "1000": " 1000",
                 "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6", "100000000": " 100E6"}
    source: "RM p.12-109..12-111 :<function>:RANGe[:UPPer] <n> (fixed range turns autorange off), :RANGe:AUTO ON"
  rng_q: {source: "RM p.12-110 :RANGe[:UPPer]? (full scale of the present range)"}
  auto_q: {source: "RM p.12-109 :RANGe:AUTO? → 0|1"}
  nplc_q:
    parse: [trim, number, {map: {"0.0005": "0.0005", "0.01": "0.01", "0.1": "0.1", "1.0": "1", "5.0": "5", "10.0": "10", "12.0": "12"}}]
    source: "RM :<function>:NPLCycles? (default 1)"
  rate_set:
    params:
      plc: {values: {"0.0005": "0.0005", "0.01": "0.01", "0.1": "0.1", "1": "1", "10": "10", "0.02": null, "0.2": null, "100": null}}
    source: "RM :<function>:NPLCycles <n> 0.0005 to 15 (60 Hz) or 12 (50 Hz)"
  temp_scale_set:
    send: ":SENS:TEMP:UNIT {unit}"
    params: {unit: {type: enum, values: {C: CELS, F: FAHR, K: KELV}}}
    source: "RM p.12-134 [:SENSe[1]]:<function>:UNIT KELVin|CELSius|FAHRenheit"
  temp_sensor_set:
    send: "{sensor}"
    params:
      sensor:
        type: enum
        values: {K: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE K", J: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE J",
                 T: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE T", E: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE E",
                 N: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE N", R: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE R",
                 S: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE S", B: ":SENS:TEMP:TRAN TC;:SENS:TEMP:TC:TYPE B",
                 RTD: ":SENS:TEMP:TRAN RTD", TRTD: ":SENS:TEMP:TRAN TRTD", FRTD: ":SENS:TEMP:TRAN FRTD",
                 THER: ":SENS:TEMP:TRAN THER"}
    reply: none
    safety: configure
    settle_ms: 800
    source: "RM p.12-133 :TEMPerature:TRANsducer, p.12-129 :TEMPerature:TCouple:TYPE"
classes:
  DMM:
    features:
      rate: [{value: "0.0005", display: "0.0005 PLC (fastest)"}, {value: "0.01", display: "0.01 PLC"}, {value: "0.1", display: "0.1 PLC"}, {value: "1", display: "1 PLC (default)"}, {value: "10", display: "10 PLC (slow)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.00001", display: "10µA"}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A (rear)"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}, {value: "10", display: "10A (rear)"}]
        RES: [{value: AUTO, display: AUTO}, {value: "10", display: "10Ω"}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "1", display: "1Ω"}, {value: "10", display: "10Ω"}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}, {value: "0.001", display: "1mF"}]
        TEMP:
          Sensor: [{value: K, display: "K thermocouple"}, {value: J, display: "J thermocouple"}, {value: T, display: "T thermocouple"}, {value: E, display: "E thermocouple"}, {value: N, display: "N thermocouple"}, {value: R, display: "R thermocouple"}, {value: S, display: "S thermocouple"}, {value: B, display: "B thermocouple"}, {value: RTD, display: "RTD 2-wire"}, {value: TRTD, display: "RTD 3-wire"}, {value: FRTD, display: "RTD 4-wire"}, {value: THER, display: "Thermistor"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
