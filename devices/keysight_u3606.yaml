# Keysight (Agilent) U3606B multimeter + DC power supply: the DMM part only (the 30 W supply,
# SOUR:VOLT/CURR, OUTP, would be a PSU binding). Written from the U3606B Programmer's
# Reference (ai_context/migration/coverage/DMM.md §3.16) before anyone tested it.
schema: benchmesh.device/v1
id: keysight_u3606
extends: scpi_dmm
vendor: Keysight
family: U3606B multimeter | DC power supply (DMM part)
version: 0.1.0
sources:
  - {doc: "U3606B Programmer's Reference U3606-90068 (PDF page = printed page + 12)", pages: "93-119 CONFigure, 183-240 SENSe, 350 *IDN? (PDF)"}
  - {doc: "U3606B vs U3606A application note 5991-4383EN"}
  - {note: "USBTMC (and GPIB); vendor 0x0957 assumed from the Agilent IDN, product id unknown. No NPLC (speed is the 4½/5½-digit resolution), no 4-wire Ω, no temperature"}
models:
  - name: U3606B
    match: "(?i)^(agilent|keysight) technologies,U3606B,"
link:
  usbtmc: {vid: "0957"}
  tcp: null
framing:
  timing: {min_gap_ms: 2}
commands:
  func:
    # FUNC? answers the short form unquoted (VOLT:AC, FREQ:VOLT); FREQ:CURR, PWID, DCYC, LRES,
    # VOLT:ACDC are not offered (MODE null)
    parse:
      - trim
      - unquote
      - upper
      - map: {"VOLT": VOLT, "VOLT:AC": VOLT_AC, "CURR": CURR, "CURR:AC": CURR_AC, "RES": RES, "CAP": CAP,
              "FREQ": FREQ, "FREQ:VOLT": FREQ, "CONT": CONT, "DIOD": DIOD}
    source: "p.183-184 [SENSe:]FUNCtion? → VOLT:AC"
  meas: {source: "p.94 READ?; ±9.900000E+37 overload, +9.910000E+37 range change in progress"}
  mode_set:
    params:
      mode:
        type: enum
        values: {FRES: null, PER: null, TEMP: null}
    source: "p.93-119 CONFigure:<function> [<range>|AUTO]"
  rng_q:
    params:
      fn: {type: enum, from: func, values: {FRES: null}}
    source: "p.185 [SENSe:]<fn>:RANGe?"
  auto_q:
    params:
      fn: {type: enum, from: func, values: {FRES: null}}
    source: "p.187 [SENSe:]<fn>:RANGe:AUTO? → 0|1"
  range_set:
    params:
      fn: {type: enum, from: func, values: {FRES: null}}
      range:
        type: enum
        values: {"0.000000001": " 1E-9", "0.00000001": " 10E-9", "0.0000001": " 100E-9", "0.000001": " 1E-6",
                 "0.00001": " 10E-6", "0.0001": " 100E-6", "0.001": " 1E-3", "0.01": " 10E-3", "0.02": " 20E-3",
                 "0.1": " 0.1", "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750", "1000": " 1000",
                 "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6", "100000000": " 100E6"}
    source: "p.185-240 <fn>:RANGe <range> / :RANGe:AUTO ON"
  nplc_q: null
  rate_set: null
  temp_scale_set: null
classes:
  DMM:
    features:
      modes: {FRES: null, PER: null, TEMP: null}
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.02", display: "20mV"}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1000mA"}, {value: "3", display: "3A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1000mA"}, {value: "3", display: "3A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "100000000", display: "100MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}, {value: "0.001", display: "1mF"}, {value: "0.01", display: "10mF"}]
    operations:
      rate: null
      temp_scale: null
