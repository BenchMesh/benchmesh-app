# Generated once from the Python manifest + hand-authored protocol description;
# this file is now the source of truth. See ai_context/migration/device-notes/owon_dge.md.
schema: benchmesh.device/v1
id: owon_dge
vendor: OWON
family: DGE2000 series arbitrary waveform generator
version: 1.0.0
sources:
  - {doc: "DGE2000/3000 SCPI Protocol", pages: "5-39"}
  - {doc: "DGE2000 Arbitrary Waveform Generator User Manual", pages: "38-49"}
  - {capture: captures/20261016-201609}
  - {capture: captures/20261016-203514}
  - {capture: captures/20261016-204256-owon-dge2070-query_screenshot, note: "split-read failure mode"}
models:
  - {"name": "DGE2070", "match": "^OWON,DGE2070,", "support": "tested"}
  - {"name": "DGE2035", "match": "^OWON,DGE2035,"}
  - {"name": "DGE3032", "match": "^OWON,DGE3032,", "note": "Not covered by the DGE2000 manuals; channel count unverified"}
  - {"name": "DGE3062", "match": "^OWON,DGE3062,", "note": "Not covered by the DGE2000 manuals; channel count unverified"}
  - {"name": "DGE3031", "match": "^OWON,DGE3031,", "note": "Not covered by the DGE2000 manuals; channel count unverified"}
  - {"name": "DGE3061", "match": "^OWON,DGE3061,", "note": "Not covered by the DGE2000 manuals; channel count unverified"}
identify: idn
link:
  usbtmc: {vid: "5345", pid: "1235"}
framing:
  tx: {terminator: "\r"}
  rx: {mode: message, strip_trailing: "\r\n", timeout_ms: 1000}
  timing: {min_gap_ms: 0, gap_after_write_ms: 20}
commands:
  idn: {send: "*IDN?", parse: [trim], source: PM p13}
  outp_q:
    send: "OUTPut{ch}:STATe?"
    parse: [trim, {map: {"1": "ON", "0": "OFF"}}]
    source: PM p14
  shape_q:
    send: "SOURce{ch}:FUNCtion:SHAPe?"
    # Replies SIN, SQU, RAMP, PRN - but PULS for pulse: report the setter's name (PUL)
    parse: [trim, upper, {map: {SIN: SIN, SQU: SQU, RAMP: RAMP, PULS: PUL, PUL: PUL, PRN: PRN, _: ""}}]
    source: "PM p26; PULS verified on DGE2070 2026-10-17"
  symm_q: {send: "SOURce{ch}:FUNCtion:RAMP:SYMMetry?", parse: [trim, number], source: PM p26}
  freq_q: {send: "SOURce{ch}:FREQuency?", parse: [trim, number], description: "Reply format unverified", source: PM p23-24}
  ampl_q: {send: "SOURce{ch}:VOLTage?", parse: [trim, number], description: "Vpp; reply format unverified", source: PM p35}
  offs_q: {send: "SOURce{ch}:VOLTage:OFFSet?", parse: [trim, number], description: "Reply format unverified", source: PM p34-35}
  phase_q: {send: "SOURce{ch}:PHASe?", parse: [trim, number], description: "Radians; reply format unverified", source: PM p27-28}
  outp_set:
    send: "OUTPut{ch}:STATe {on}"
    params: {on: {type: enum, values: {"ON": "ON", "OFF": "OFF"}}}
    reply: none
    safety: energize
    source: PM p14
  shape_set:
    send: "SOURce{ch}:FUNCtion:SHAPe {shape}"
    params: {shape: {type: enum, values: {SIN: SINusoid, SQU: SQUare, PUL: PULSe, RAMP: RAMP, PRN: PRNoise}}}
    reply: none
    safety: configure
    source: PM p26
  freq_set:
    send: "SOURce{ch}:FREQuency {hz}"
    params: {hz: {type: number, min: 0.000001, max: 70000000, format: "%g", unit: Hz}}
    reply: none
    safety: configure
    source: PM p23-24
  ampl_set:
    send: "SOURce{ch}:VOLTage {vpp}"
    params: {vpp: {type: number, min: 0.001, max: 20, format: "%g", unit: Vpp}}
    reply: none
    safety: configure
    source: PM p35
  offs_set:
    send: "SOURce{ch}:VOLTage:OFFSet {v}"
    params: {v: {type: number, min: -10, max: 10, format: "%g", unit: V}}
    reply: none
    safety: configure
    source: PM p34-35
  phase_set:
    send: "SOURce{ch}:PHASe {deg}DEG"
    params: {deg: {type: number, min: 0, max: 360, format: "%g", unit: deg}}
    reply: none
    safety: configure
    source: PM p27-28
  symm_set:
    send: "SOURce{ch}:FUNCtion:RAMP:SYMMetry {pct}"
    params: {pct: {type: number, min: 0, max: 100, format: "%g", unit: "%"}}
    reply: none
    safety: configure
    source: PM p26
  screenshot:
    send: "HCOPy:SDUMp:DATA?"
    reply: block
    timeout_ms: 10000
    max_bytes: 1048576
    description: >-
      IEEE 488.2 block with a 480x272 24-bit BMP (391734 B). NOT exposed as an operation:
      the DGE sends it as raw bulk packets without valid USBTMC headers after the first
      52 bytes, which the Linux usbtmc driver cannot read (kernel: "too small first packet",
      "wrong MsgID", then EOVERFLOW until replug). Needs a userspace USBTMC transport that
      reads raw bulk-in until the IEEE length is complete (bench 2026-10-16).
    source: PM p12
classes:
  AWG:
    channels: 2
    ui_component: GenericAWG
    features: {"lock": false, "compulsory_lock": false, "channel_colors": {"1": "#FFD700", "2": "#4169E1"}}
    poll:
      - every_ms: 1000
        read: [outp_q]
      - every_ms: 5000
        read: [shape_q, freq_q, ampl_q, offs_q, phase_q, symm_q]
    status:
      OUTPUT: outp_q
      SHAPE: shape_q
      FREQ: {expr: freq_q, as: si}
      AMPL: {expr: ampl_q, as: si}
      OFFS: {expr: offs_q, as: si}
      PHASE: "phase_q * 180.0 / 3.141592653589793"
      SYMM: symm_q
    operations:
      output: {get: outp_q, set: outp_set}
      shape: {get: shape_q, set: shape_set}
      frequency: {get: freq_q, set: freq_set, as: si}
      amplitude: {get: ampl_q, set: ampl_set, as: si}
      offset: {get: offs_q, set: offs_set, as: si}
      phase: {set: phase_set}
      symmetry: {get: symm_q, set: symm_set}
      # screenshot: {get: screenshot, as: bytes}  — disabled until the userspace USBTMC transport exists
