# Generated once from the Python manifest + hand-authored protocol description;
# this file is now the source of truth. See ai_context/migration/device-notes/owon_xdm.md.
schema: benchmesh.device/v1
id: owon_xdm
vendor: OWON
family: XDM1000 series digital multimeter
version: 1.0.0
sources:
  - {doc: "XDM1000 Digital Multimeter Programming Manual", pages: "7-26"}
  - {doc: "OWON XDM1141 User Manual", pages: "17-39"}
  - {capture: captures/20261016-201609, note: "read-only"}
  - {capture: captures/20261016-203514, note: "setters"}
models:
  - {"name": "XDM1241", "match": "^OWON,XDM1241,", "verified": true}
  - {"name": "XDM1041", "match": "^OWON,XDM1041,", "verified": false}
  - {"name": "XDM1141", "match": "^OWON,XDM1141,", "verified": false}
identify: idn
link:
  serial: {baud: 115200, format: 8N1, flow: none, dtr: low, rts: low, settle_ms: 50}
framing:
  tx: {terminator: "\r"}
  # Replies end "\r\n". Terminating on "\n" consumes the whole reply (the Python driver
  # stopped at "\r" and skipped the stray "\n" on the next read).
  rx: {mode: terminator, terminator: "\n", skip_leading: "\r\n", strip_trailing: "\r", timeout_ms: 300, drain_idle_ms: 20}
  timing: {min_gap_ms: 0, gap_after_write_ms: 50}
state:
  range: {type: string, description: "No documented range query: null (unknown) until we set it; AUTO after our mode change"}
commands:
  idn: {send: "*IDN?", parse: [trim], source: PM p.9}
  func:
    send: "FUNCtion?"
    parse:
      - trim
      - unquote
      - map: {"VOLT": VOLT, "VOLT AC": VOLT_AC, "CURR": CURR, "CURR AC": CURR_AC, "RES": RES,
              "FRES": FRESistance, "CAP": CAP, "DIOD": DIOD, "CONT": CONT, "TEMP": TEMP,
              "FREQ": FREQ, "PER": PER}
    source: PM p.11
  meas:
    send: "MEAS1?"
    parse: [trim, number]
    description: Main display value in the selected unit; device refreshes ~1/s at rate S
    source: PM p.25-26
  rate_q: {send: "RATE?", parse: [trim], description: "F|M|S (manual says L for slow; device uses S)", source: PM p.24-25}
  mode_set:
    send: "{mode}"
    params:
      mode:
        type: enum
        values: {VOLT: "CONF:VOLT:DC AUTO", VOLT_AC: "CONF:VOLT:AC AUTO", CURR: "CONF:CURR:DC AUTO",
                 CURR_AC: "CONF:CURR:AC AUTO", RES: "CONF:RES AUTO", FRESistance: "CONF:FRES AUTO",
                 CAP: "CONF:CAP AUTO", DIOD: "CONF:DIOD", CONT: "CONF:CONT", FREQ: "CONF:FREQ",
                 PER: "CONF:PER", TEMP: "CONF:TEMPerature:RTD KITS90"}
    reply: none
    safety: configure
    effects: {range: "AUTO"}
    gap_after_ms: 3000  # CONF:TEMP stalls the meter ~2.8 s; other modes need ~1 s
    settle_ms: 1500     # first readings after CONF carry the previous mantissa
    source: PM p.13-17
  range_set:
    send: "CONF:{fn} {range}"
    params:
      fn:
        type: enum
        from: func
        values: {VOLT: "VOLT:DC", VOLT_AC: "VOLT:AC", CURR: "CURR:DC", CURR_AC: "CURR:AC",
                 RES: "RES", FRESistance: "FRES", CAP: "CAP"}
      range: {type: string, pattern: "^(AUTO|MIN|MAX|DEF|[0-9]+(\\.[0-9]+)?(E-?[0-9]+)?)$"}
    reply: none
    safety: configure
    effects: {range: "{range}"}
    gap_after_ms: 1000
    settle_ms: 1500
    source: PM p.13-16
  temp_sensor_set:
    send: "CONF:TEMPerature:RTD {sensor}"
    params: {sensor: {type: enum, values: {KITS90: KITS90, PT100: PT100}}}
    reply: none
    safety: configure
    gap_after_ms: 3000
    settle_ms: 1500
    source: PM p.16
  temp_scale_set:
    send: "TEMPerature:RTD:UNIT {unit}"
    params: {unit: {type: enum, values: {C: C, F: F, K: K}}}
    reply: none
    safety: configure
    source: PM p.12
  rate_set:
    send: "RATE {rate}"
    params: {rate: {type: enum, values: {F: F, M: M, S: S, L: S}}}
    description: "Device uses S for slow; the manual's L is silently ignored (bench 2026-10-16). L accepted as alias"
    reply: none
    safety: configure
    requires:
      expr: 'func in ["VOLT", "VOLT_AC", "CURR", "CURR_AC", "RES"]'
      message: "Rate is only selectable in DCV, ACV, DCI, ACI and RES (user manual p.18)"
    source: PM p.24-25
classes:
  DMM:
    channels: 1
    ui_component: GenericDMM
    features: {"lock": true, "compulsory_lock": false, "modes": {"VOLT": {"unit": "V", "symbol": "U", "note": "DC", "techname": "VOLT", "ui_name": "Voltage DC", "ui_component": "GenericRange"}, "VOLT_AC": {"unit": "V", "symbol": "U", "note": "AC", "techname": "VOLT AC", "ui_name": "Voltage AC", "ui_component": "GenericRange"}, "CURR": {"unit": "A", "symbol": "I", "note": "DC", "techname": "CURR", "ui_name": "Current DC", "ui_component": "GenericRange"}, "CURR_AC": {"unit": "A", "symbol": "I", "note": "AC", "techname": "CURR AC", "ui_name": "Current AC", "ui_component": "GenericRange"}, "RES": {"unit": "Ω", "symbol": "R", "techname": "RES", "ui_name": "Resistance", "ui_component": "GenericRange"}, "FRESistance": {"unit": "Ω", "symbol": "R", "note": "4W", "techname": "RES", "ui_name": "Resistance", "ui_component": "GenericRange"}, "CAP": {"unit": "F", "symbol": "C", "techname": "CAP", "ui_name": "Capacitance", "ui_component": "GenericRange"}, "DIOD": {"unit": "V", "symbol": "D", "techname": "DIOD", "ui_name": "Diode"}, "CONT": {"unit": "Ω", "symbol": "R", "note": "buzzer", "techname": "CONT", "ui_name": "Continuity"}, "TEMP": {"unit": "K", "symbol": "T", "techname": "TEMP", "ui_name": "Temperature", "ui_component": "GenericTemp"}, "FREQ": {"unit": "Hz", "symbol": "f", "techname": "FREQ", "ui_name": "Frequency"}, "PER": {"unit": "s", "symbol": "T", "techname": "PER", "ui_name": "Period"}}, "delta": true, "DB:REFerence": [50, 75, 93, 110, 124, 125, 135, 150, 250, 300, 500, 600, 800, 900, 1000, 1200, 8000], "DBM:REFerence": [50, 75, 93, 110, 124, 125, 135, 150, 250, 300, 500, 600, 800, 900, 1000, 1200, 8000], "rate": [{"value": "F", "display": "fast"}, {"value": "M", "display": "normal"}, {"value": "L", "display": "slow"}], "RANGe": {"CAP": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "50E-9", "display": "50nF"}, {"value": "500E-9", "display": "500nF"}, {"value": "5E-6", "display": "5µF"}, {"value": "50E-6", "display": "50µF"}, {"value": "500E-6", "display": "500µF"}, {"value": "5E-3", "display": "5mF"}, {"value": "50E-3", "display": "50mF"}], "FRESistance": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "500", "display": "500Ω"}, {"value": "5E3", "display": "5KΩ"}, {"value": "50E3", "display": "50KΩ"}, {"value": "500E3", "display": "500KΩ"}, {"value": "5E6", "display": "5MΩ"}, {"value": "50E6", "display": "50MΩ"}, {"value": "500E6", "display": "500MΩ"}], "RES": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "500", "display": "500Ω"}, {"value": "5E3", "display": "5KΩ"}, {"value": "50E3", "display": "50KΩ"}, {"value": "500E3", "display": "500KΩ"}, {"value": "5E6", "display": "5MΩ"}, {"value": "50E6", "display": "50MΩ"}, {"value": "500E6", "display": "500MΩ"}], "CURR_AC": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "500E-6", "display": "500µA"}, {"value": "5E-3", "display": "5mA"}, {"value": "50E-3", "display": "50mA"}, {"value": "500E-3", "display": "500mA"}, {"value": "5", "display": "5A"}, {"value": "10", "display": "10A"}], "CURR": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "500E-6", "display": "500µA"}, {"value": "5E-3", "display": "5mA"}, {"value": "50E-3", "display": "50mA"}, {"value": "500E-3", "display": "500mA"}, {"value": "5", "display": "5A"}, {"value": "10", "display": "10A"}], "VOLT_AC": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "500E-3", "display": "500mV"}, {"value": "5", "display": "5V"}, {"value": "50", "display": "50V"}, {"value": "500", "display": "500V"}, {"value": "750", "display": "750V"}], "VOLT": [{"value": "AUTO", "display": "AUTO"}, {"value": "MIN", "display": "MINimum"}, {"value": "MAX", "display": "MAXimum"}, {"value": "50E-3", "display": "50mV"}, {"value": "500E-3", "display": "500mV"}, {"value": "5", "display": "5V"}, {"value": "50", "display": "50V"}, {"value": "500", "display": "500V"}, {"value": "1000", "display": "1000V"}], "TEMP": {"Sensor": [{"value": "KITS90", "display": "KITS90"}, {"value": "PT100", "display": "PT100"}], "Scale": [{"unit": "°C", "symbol": "C", "display": "Celsius"}, {"unit": "°F", "symbol": "F", "display": "Fahrenheit"}, {"unit": "K", "symbol": "K", "display": "Kelvin"}]}}}
    poll:
      - every_ms: 300
        read: [meas, func]
    status:
      MEAS: {expr: meas, as: si}
      MODE: func
      RANGE: state.range
    operations:
      mode: {set: mode_set}
      range: {set: range_set}
      measurement: {get: meas, as: si}
      function: {get: func}
      temp_sensor: {set: temp_sensor_set}
      temp_scale: {set: temp_scale_set}
      rate: {get: rate_q, set: rate_set}
