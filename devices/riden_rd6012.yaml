# Riden RD6012 / RD6018 / RD6024 (12-24 A) - Modbus RTU; protocol in devices/bases/riden_rd60xx.yaml.
# Written from community register maps (no vendor manual); awaiting confirmation on hardware.
# Note: recent stock firmware reportedly breaks Modbus; the community recommends UniSoft firmware.
schema: benchmesh.device/v1
id: riden_rd6012
extends: riden_rd60xx
family: RD6012 / RD6018 / RD6024 (12-24 A)
sources:
  - {note: "Baldanos/rd6006 registers.md (Apache-2.0), ShayBox/Riden register.py, sigrok rdtech-dps; scales per model id: ai_context/migration/coverage/PSU.md §2.2"}
models:
  - {"name": "RD6012", "match": "^6012[0-4]$", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 12.0}, "power": {"unit": "W", "max": 720.0}}}}}
  - {"name": "RD6018", "match": "^6018[0-9]$", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 18.0}, "power": {"unit": "W", "max": 1080.0}}}}}
  - {"name": "RD6024", "match": "^602[4-9][0-9]$", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 24.0}, "power": {"unit": "W", "max": 1440.0}}}}}
commands:
  st:
    parse:
      - registers:
          vset: {at: 0, scale: 0.01}
          iset: {at: 1, scale: 0.01}
          vout: {at: 2, scale: 0.01}
          iout: {at: 3, scale: 0.01}
          pout: {at: 4, type: u32, scale: 0.01}
          vin:  {at: 6, scale: 0.01}
          lock: {at: 7}
          prot: {at: 8}
          cvcc: {at: 9}
          out:  {at: 10}
  limits:
    parse: [{registers: {ovp: {at: 0, scale: 0.01}, ocp: {at: 1, scale: 0.01}}}]
  vset_q: {modbus: {fn: read_holding, register: 8}, parse: [{word: {at: 0, scale: 0.01}}]}
  iset_q: {modbus: {fn: read_holding, register: 9}, parse: [{word: {at: 0, scale: 0.01}}]}
  vout_q: {modbus: {fn: read_holding, register: 10}, parse: [{word: {at: 0, scale: 0.01}}]}
  iout_q: {modbus: {fn: read_holding, register: 11}, parse: [{word: {at: 0, scale: 0.01}}]}
  ovp_q: {modbus: {fn: read_holding, register: 82}, parse: [{word: {at: 0, scale: 0.01}}]}
  ocp_q: {modbus: {fn: read_holding, register: 83}, parse: [{word: {at: 0, scale: 0.01}}]}
  vset:
    modbus: {fn: write_single, register: 8, value: v}
    params: {v: {type: number, min: 0, max: 60.0, scale: 100, unit: V}}
    safety: configure
  iset:
    modbus: {fn: write_single, register: 9, value: i}
    params: {i: {type: number, min: 0, max: 24.0, scale: 100, unit: A}}
    safety: configure
  ovp_set:
    modbus: {fn: write_single, register: 82, value: v}
    params: {v: {type: number, min: 0, max: 62.0, scale: 100, unit: V}}
    safety: configure
  ocp_set:
    modbus: {fn: write_single, register: 83, value: i}
    params: {i: {type: number, min: 0, max: 24.2, scale: 100, unit: A}}
    safety: configure
