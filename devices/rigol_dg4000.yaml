# RIGOL DG4000 series function/arbitrary waveform generators (DG4062/DG4102/DG4162/DG4202).
# Written from the programming guide before anyone tested it on hardware.
# Research: ai_context/migration/coverage/AWG.md §2.1 ("DG4000 differences"). Pages are PDF pages
# of the mirror copy (646 small pages).
schema: benchmesh.device/v1
id: rigol_dg4000
extends: scpi_awg
vendor: RIGOL
family: DG4000 series function/arbitrary waveform generator
version: 0.1.0
sources:
  - {doc: "DG4000 Programming Guide PGB04108 (DG4000_ProgrammingGuide_EN.pdf)", pages: "148 (*IDN?), 199-201 (OUTPut STATe/IMPedance), 319-324 (FREQ), 337-341 (FUNC, RAMP:SYMM), 477-478 (PHAS), 517-527 (VOLT, OFFS, UNIT); USB id p557 (VISA example USB0::0X1AB1::0X0640)"}
  - {note: "USB PID 0640 per the guide's VISA example; other sources say 0641 - the link names the vendor only. LAN socket port not stated in the guide (omitted). Default load is High-Z."}
models:
  - {"name": "DG4062", "match": "^Rigol Technologies,DG4062,", "features": {"AWG": {"max_freq_hz": {"SIN": 60e6, "SQU": 25e6}}}}
  - {"name": "DG4102", "match": "^Rigol Technologies,DG4102,", "features": {"AWG": {"max_freq_hz": {"SIN": 100e6, "SQU": 40e6}}}}
  - {"name": "DG4162", "match": "^Rigol Technologies,DG4162,", "features": {"AWG": {"max_freq_hz": {"SIN": 160e6, "SQU": 50e6}}}}
  - {"name": "DG4202", "match": "^Rigol Technologies,DG4202,", "features": {"AWG": {"max_freq_hz": {"SIN": 200e6, "SQU": 60e6}}}}
link:
  # guide p557 example USB0::0X1AB1::0X0640 (other reports say 0641): vendor only, identify picks the model
  usbtmc: {vid: "1ab1"}
  # LAN is built in (guide p2, :SYST:COMM:LAN p528-540); the guide names no socket port: 5555 is
  # Rigol's raw SCPI port (documented for DG1000Z p203), unconfirmed on DG4000. VXI-11 also works.
  tcp: {port: 5555}
commands:
  outp_q: {source: "PDF p199; reply ON/OFF"}
  outp_set: {source: "PDF p199"}
  shape_q: {source: "PDF p341"}
  shape_set: {source: "PDF p341"}
  freq_q: {source: "PDF p324"}
  freq_set:
    params: {hz: {type: number, min: 0.000001, max: 200000000, format: "%.6f", unit: Hz}}
    source: "PDF p324"
  unit_q: {source: "PDF p526-527"}
  ampl_q: {source: "PDF p518"}
  ampl_set:
    params: {vpp: {type: number, min: 0.002, max: 20, format: "%.4f", unit: Vpp}}
    description: "20 Vpp at High-Z ≤20 MHz (10 Vpp into 50 Ω), 10 Vpp ≤70 MHz - the instrument clamps"
    source: "PDF p518"
  offs_q: {source: "PDF p524-525"}
  offs_set: {source: "PDF p524-525"}
  phase_q: {source: "PDF p478"}
  phase_set: {source: "PDF p478"}
  symm_q: {source: "PDF p339-340"}
  symm_set: {source: "PDF p339-340"}
  load_q:
    send: ":OUTP{ch}:IMP?"
    source: "PDF p199-201; ohms as a plain number (100), High-Z the text INFINITY"
classes:
  AWG:
    features: {"max_freq_hz": {"SIN": 200e6, "SQU": 60e6}}
