# Rigol DM858 / DM858E bench multimeters. Written from the DM858 programming guide
# (ai_context/migration/coverage/DMM.md §3.5) before anyone tested it: every model awaits
# confirmation. Keysight-style SCPI → devices/bases/scpi_dmm.yaml. Pages are printed pages.
schema: benchmesh.device/v1
id: rigol_dm858
extends: scpi_dmm
vendor: RIGOL
family: DM858 series digital multimeter
version: 0.1.0
sources:
  - {doc: "DM858 Series Programming Guide (DM858_ProgrammingGuide_EN.pdf)", pages: "11-12, 24-34, 42, 92-93, 109-110 (printed)"}
  - {note: "USBTMC (Rigol vid 0x1AB1; PID not documented) and LAN (raw socket 5025, guide §2); no RS-232"}
models:
  - name: DM858
    match: "(?i)^rigol technologies,DM858,"
  - name: DM858E
    match: "(?i)^rigol technologies,DM858E,"
    features:
      DMM:
        RANGe:
          CURR: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
          CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "3", display: "3A"}]
          CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}, {value: "0.001", display: "1mF"}]
link:
  usbtmc: {vid: "1ab1"}
commands:
  idn: {source: "p.42 *IDN? → RIGOL TECHNOLOGIES,<model>,<serial>,<version>"}
  func: {source: "p.92-93 [SENSe]:FUNCtion? → \"VOLT\", \"VOLT:AC\", \"CURR\" …"}
  meas: {source: "p.11 READ?; 9.9E37 on overload (MEASure/DATA:LAST?)"}
  rng_q: {source: "p.109 [SENSe]:VOLTage:DC:RANGe? → 1.00000000E+00"}
  auto_q: {source: "p.110 [SENSe]:VOLTage:DC:RANGe:AUTO? → 0|1"}
  nplc_q:
    parse: [trim, number, {map: {"0.4": "0.4", "5.0": "5", "20.0": "20"}}]
    source: "p.110 [SENSe]:VOLTage[:DC]:NPLC? {0.4|5|20}"
  rate_set:
    params:
      plc: {type: enum, values: {"0.4": "0.4", "5": "5", "20": "20", "0.02": null, "0.2": null, "1": null, "10": null, "100": null}}
    source: "p.110 NPLC {0.4|5|20} (fast/medium/slow), default 20"
  mode_set:
    source: "p.24-34 CONFigure:<function> [AUTO]; TEMP defaults to a thermocouple"
  range_set:
    params:
      range:
        type: enum
        values: {"0.000000001": " 1E-9", "0.00000001": " 10E-9", "0.0000001": " 100E-9", "0.000001": " 1E-6",
                 "0.00001": " 10E-6", "0.0001": " 100E-6", "0.001": " 1E-3", "0.01": " 10E-3", "0.1": " 0.1",
                 "1": " 1", "3": " 3", "10": " 10", "100": " 100", "750": " 750", "1000": " 1000",
                 "10000": " 10E3", "100000": " 100E3", "1000000": " 1E6", "10000000": " 10E6", "50000000": " 50E6"}
    source: "p.69-110 [SENSe]:<fn>:RANGe / :RANGe:AUTO ON"
  temp_sensor_set:
    send: "CONF:TEMP {sensor}"
    params:
      sensor:
        type: enum
        values: {TC_K: "TC,K", TC_J: "TC,J", TC_T: "TC,T", TC_E: "TC,E", TC_N: "TC,N", TC_R: "TC,R", TC_S: "TC,S",
                 TC_B: "TC,B", RTD_385: "RTD,385", FRTD_385: "FRTD,385", THER_5000: "THER,5000", FTH_5000: "FTH,5000"}
    reply: none
    safety: configure
    invalidates: [func, rng_q, auto_q]
    gap_after_ms: 300
    settle_ms: 800
    source: "p.31 CONFigure:TEMPerature {FRTD|RTD|FTHermistor|THERmistor|TCouple},<type>"
  temp_scale_set: {source: "p.12 UNIT:TEMPerature {C|F|K}"}
classes:
  DMM:
    features:
      rate: [{value: "0.4", display: "0.4 PLC (fast)"}, {value: "5", display: "5 PLC (medium)"}, {value: "20", display: "20 PLC (slow)"}]
      RANGe:
        VOLT: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "1000", display: "1000V"}]
        VOLT_AC: [{value: AUTO, display: AUTO}, {value: "0.1", display: "100mV"}, {value: "1", display: "1V"}, {value: "10", display: "10V"}, {value: "100", display: "100V"}, {value: "750", display: "750V"}]
        CURR: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "10", display: "10A"}]
        CURR_AC: [{value: AUTO, display: AUTO}, {value: "0.0001", display: "100µA"}, {value: "0.001", display: "1mA"}, {value: "0.01", display: "10mA"}, {value: "0.1", display: "100mA"}, {value: "1", display: "1A"}, {value: "10", display: "10A"}]
        RES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "50000000", display: "50MΩ"}]
        FRES: [{value: AUTO, display: AUTO}, {value: "100", display: "100Ω"}, {value: "1000", display: "1kΩ"}, {value: "10000", display: "10kΩ"}, {value: "100000", display: "100kΩ"}, {value: "1000000", display: "1MΩ"}, {value: "10000000", display: "10MΩ"}, {value: "50000000", display: "50MΩ"}]
        CAP: [{value: AUTO, display: AUTO}, {value: "0.000000001", display: "1nF"}, {value: "0.00000001", display: "10nF"}, {value: "0.0000001", display: "100nF"}, {value: "0.000001", display: "1µF"}, {value: "0.00001", display: "10µF"}, {value: "0.0001", display: "100µF"}, {value: "0.001", display: "1mF"}, {value: "0.01", display: "10mF"}]
        TEMP:
          Sensor: [{value: TC_K, display: "K thermocouple"}, {value: TC_J, display: "J thermocouple"}, {value: TC_T, display: "T thermocouple"}, {value: TC_E, display: "E thermocouple"}, {value: TC_N, display: "N thermocouple"}, {value: TC_R, display: "R thermocouple"}, {value: TC_S, display: "S thermocouple"}, {value: TC_B, display: "B thermocouple"}, {value: RTD_385, display: "RTD α385 (2-wire)"}, {value: FRTD_385, display: "RTD α385 (4-wire)"}, {value: THER_5000, display: "Thermistor 5 kΩ (2-wire)"}, {value: FTH_5000, display: "Thermistor 5 kΩ (4-wire)"}]
          Scale: [{unit: "°C", symbol: C, display: Celsius}, {unit: "°F", symbol: F, display: Fahrenheit}, {unit: K, symbol: K, display: Kelvin}]
    operations:
      temp_sensor: {set: temp_sensor_set}
