# RIGOL DP800 series programmable DC power supplies, written from the programming guide before
# anyone tested it on hardware (every model: Awaiting confirmation).
# Commands: devices/bases/rigol_dp.yaml. Research: ai_context/migration/coverage/PSU.md §2.5.
schema: benchmesh.device/v1
extends: rigol_dp
id: rigol_dp800
vendor: RIGOL
family: DP800 series programmable DC power supply (DP811/DP821/DP831/DP832, A and non-A)
version: 0.1.0
sources:
  - {doc: "DP800 Programming Guide (DP800_ProgrammingGuide_EN_2015.pdf)", pages: "1-2, 2-8 (Table 2-1), 2-24, 2-34..2-36, 2-52 (Table 2-2), 2-53..2-63, 2-83, 2-90, 2-121, 2-123, 4-2 (USB0::0x1AB1::0x0E11)"}
  - {doc: "DP800 User's Guide (DP800_UserGuide_EN.pdf)", pages: "front matter (up to 200 W total)"}
  - {note: "Power limits are the sums of the rated channel V x A. Non-A models have lower setting resolution unless the high-resolution option is installed (PG p.2-8 note). LAN and RS232 are factory-installed on the A models and options on DP811/821/831/832 (PG p.1-2 note, :LIC:SET). The guide gives no raw-socket port: 5555 is from community tools (DP832 MCP servers, Rigol socket users), verify. GPIB only through a USB-GPIB converter (not offered)."}
models:
  - name: DP832A
    match: "^RIGOL TECHNOLOGIES,DP832A,"
    channels: {PSU: 3}
    note: "CH1/CH2 30 V/3 A, CH3 5 V/3 A"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 32.0}, "current": {"unit": "A", "max": 3.2}, "power": {"unit": "W", "max": 195.0}}, "channel_limits": {"1": {"voltage": 32.0, "current": 3.2}, "2": {"voltage": 32.0, "current": 3.2}, "3": {"voltage": 5.3, "current": 3.2}}}}
  - name: DP832
    match: "^RIGOL TECHNOLOGIES,DP832,"
    channels: {PSU: 3}
    note: "CH1/CH2 30 V/3 A, CH3 5 V/3 A; 10 mV setting resolution without the high-resolution option; LAN and RS232 only with the installed options (PG p.1-2)"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 32.0}, "current": {"unit": "A", "max": 3.2}, "power": {"unit": "W", "max": 195.0}}, "channel_limits": {"1": {"voltage": 32.0, "current": 3.2}, "2": {"voltage": 32.0, "current": 3.2}, "3": {"voltage": 5.3, "current": 3.2}}}}
  - name: DP831A
    match: "^RIGOL TECHNOLOGIES,DP831A,"
    channels: {PSU: 3}
    note: "CH1 8 V/5 A, CH2 30 V/2 A, CH3 -30 V/2 A. CH3 is negative (settable 0 to -32 V): the voltage setter accepts 0..63 V only, so CH3 cannot be programmed below 0 V yet"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 32.0}, "current": {"unit": "A", "max": 5.3}, "power": {"unit": "W", "max": 160.0}}, "channel_limits": {"1": {"voltage": 8.4, "current": 5.3}, "2": {"voltage": 32.0, "current": 2.1}, "3": {"voltage": -32.0, "current": 2.1}}}}
  - name: DP831
    match: "^RIGOL TECHNOLOGIES,DP831,"
    channels: {PSU: 3}
    note: "As DP831A (CH3 negative, see there); lower resolution without the option; LAN and RS232 only with the installed options (PG p.1-2)"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 32.0}, "current": {"unit": "A", "max": 5.3}, "power": {"unit": "W", "max": 160.0}}, "channel_limits": {"1": {"voltage": 8.4, "current": 5.3}, "2": {"voltage": 32.0, "current": 2.1}, "3": {"voltage": -32.0, "current": 2.1}}}}
  - name: DP821A
    match: "^RIGOL TECHNOLOGIES,DP821A,"
    channels: {PSU: 2}
    note: "CH1 60 V/1 A, CH2 8 V/10 A"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 63.0}, "current": {"unit": "A", "max": 10.5}, "power": {"unit": "W", "max": 140.0}}, "channel_limits": {"1": {"voltage": 63.0, "current": 1.05}, "2": {"voltage": 8.4, "current": 10.5}}}}
  - name: DP821
    match: "^RIGOL TECHNOLOGIES,DP821,"
    channels: {PSU: 2}
    note: "CH1 60 V/1 A, CH2 8 V/10 A; lower resolution without the option; LAN and RS232 only with the installed options (PG p.1-2)"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 63.0}, "current": {"unit": "A", "max": 10.5}, "power": {"unit": "W", "max": 140.0}}, "channel_limits": {"1": {"voltage": 63.0, "current": 1.05}, "2": {"voltage": 8.4, "current": 10.5}}}}
  - name: DP811A
    match: "^RIGOL TECHNOLOGIES,DP811A,"
    note: "Ranges 20 V/10 A and 40 V/5 A (:OUTP:RANG P20V|P40V, PG p.2-62, not exposed: no class operation); limits shown are the union"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 42.0}, "current": {"unit": "A", "max": 10.5}, "power": {"unit": "W", "max": 200.0}}}}
  - name: DP811
    match: "^RIGOL TECHNOLOGIES,DP811,"
    note: "As DP811A; lower resolution without the option; LAN and RS232 only with the installed options (PG p.1-2)"
    features: {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 42.0}, "current": {"unit": "A", "max": 10.5}, "power": {"unit": "W", "max": 200.0}}}}
link:
  usbtmc:
    vid: "1ab1"
    pid: "0e11"
    framing:
      tx: {terminator: "\n"}
      rx: {mode: message, strip_trailing: "\r\n", timeout_ms: 1000}
      timing: {min_gap_ms: 10, gap_after_write_ms: 50}
  serial:
    baud: 9600
    format: 8N1
    flow: none
    settle_ms: 50
    framing:
      # RS232 commands end in "\r\n" (PG p.1-2); default 9600 baud (PG p.2-116, appendix)
      tx: {terminator: "\r\n"}
      rx: {mode: terminator, terminator: "\n", strip_trailing: "\r", timeout_ms: 1000, drain_idle_ms: 50}
      timing: {min_gap_ms: 20, gap_after_write_ms: 50}
  # LAN (PG p.1-2 "remote communication over USB, LAN, RS232 or GPIB"; :SYST:COMM:LAN commands
  # p.2-109..2-116): raw SCPI socket. Port 5555 is not in the guide (community: Rigol's usual
  # socket port, used for the DP832 by community tools). Standard on the A models, an option on
  # the non-A models (see their notes). Replies end with a line feed.
  tcp:
    port: 5555
    framing:
      tx: {terminator: "\n"}
      rx: {mode: terminator, terminator: "\n", strip_trailing: "\r", timeout_ms: 1000, drain_idle_ms: 50}
      timing: {min_gap_ms: 10, gap_after_write_ms: 50}
classes:
  PSU:
    channels: 3
    features: {"lock": true, "compulsory_lock": false, "absolute_limits": {"voltage": {"unit": "V", "max": 32.0}, "current": {"unit": "A", "max": 3.2}, "power": {"unit": "W", "max": 195.0}}, "protection": {"OVP": {"type": "boolean"}, "OCP": {"type": "boolean"}}}
