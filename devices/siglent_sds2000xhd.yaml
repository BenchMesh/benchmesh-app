# Siglent SDS2000X HD digital oscilloscopes (12-bit, 4 channels, 100-500 MHz). Written from the
# "SDS Series Programming Guide" EN11G, not yet seen live (models are "awaiting confirmation").
# Commands and scaling: devices/bases/siglent_scope.yaml; coverage report
# ai_context/migration/coverage/OSC.md §2.5.
schema: benchmesh.device/v1
id: siglent_sds2000xhd
extends: siglent_scope
vendor: Siglent
family: SDS2000X HD series digital oscilloscope
version: 0.1.0
sources:
  - {doc: "SDS Series Programming Guide EN11G (SDS2000XHD_Series_ProgrammingGuide.pdf)", pages: "PDF p19 supported models (SDS2000X HD from firmware 1.2.0.2), p25 LAN 5025, p31 *IDN?, p34 AUToset, p42-48 ACQuire, p51-61 CHANnel, p337-369 MEASure, p474-496 TIMebase/TRIGger, p748-760 WAVeform"}
  - {note: "USBTMC product id not in the guide: matched on the Siglent vendor id f4ec"}
models:
  - {name: SDS2104X HD, match: "^Siglent Technologies,SDS2104X ?HD,", features: {OSC: {bandwidth_hz: 100e6}}}
  - {name: SDS2204X HD, match: "^Siglent Technologies,SDS2204X ?HD,", features: {OSC: {bandwidth_hz: 200e6}}}
  - {name: SDS2354X HD, match: "^Siglent Technologies,SDS2354X ?HD,", features: {OSC: {bandwidth_hz: 350e6}}}
  - {name: SDS2504X HD, match: "^Siglent Technologies,SDS2504X ?HD,", features: {OSC: {bandwidth_hz: 500e6}}}
identify: idn
commands:
  # the 200 MHz limit is listed for this family (p51)
  bwl_set:
    params: {b: {values: {"200M": "200M"}}}
classes:
  OSC:
    features:
      bandwidth_hz: 100e6
