# Siglent SDS800X HD digital oscilloscopes (12-bit, 4 channels). Written from the "SDS Series
# Programming Guide" EN11G, not yet seen live (models are "awaiting confirmation").
# Commands and scaling: devices/bases/siglent_scope.yaml; coverage report
# ai_context/migration/coverage/OSC.md §2.5.
schema: benchmesh.device/v1
id: siglent_sds800xhd
extends: siglent_scope
vendor: Siglent
family: SDS800X HD series digital oscilloscope
version: 0.1.0
sources:
  - {doc: "SDS Series Programming Guide EN11G (SDS800XHD_Series_ProgrammingGuide.pdf)", pages: "PDF p19 supported models (SDS800X HD from firmware 1.1.3.1), p25 LAN 5025, p31 *IDN?, p34 AUToset, p42-48 ACQuire, p51-61 CHANnel, p337-369 MEASure, p474-496 TIMebase/TRIGger, p748-760 WAVeform"}
  - {note: "USBTMC product id not in the guide: matched on the Siglent vendor id f4ec"}
models:
  - {name: SDS804X HD, match: "^Siglent Technologies,SDS804X ?HD,", features: {OSC: {bandwidth_hz: 70e6}}}
  - {name: SDS814X HD, match: "^Siglent Technologies,SDS814X ?HD,", features: {OSC: {bandwidth_hz: 100e6}}}
  - {name: SDS824X HD, match: "^Siglent Technologies,SDS824X ?HD,", features: {OSC: {bandwidth_hz: 200e6}}}
identify: idn
classes:
  OSC:
    features:
      bandwidth_hz: 70e6
