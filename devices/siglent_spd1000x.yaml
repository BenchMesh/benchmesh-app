# Siglent SPD1000X (SPD1168X, SPD1305X) single-output programmable DC power supply, written
# from the user manual / programming guide before any hardware test (awaiting confirmation).
schema: benchmesh.device/v1
extends: siglent_spd
id: siglent_spd1000x
vendor: Siglent
family: SPD1000X single-output programmable DC power supply (legacy SCPI)
version: 0.1.0
sources:
  - {doc: "SPD1000X User Manual / Programming Guide (SPD1000X_UserManual_ProgrammingGuide.pdf), printed pages", pages: "16 (ratings), 51 (socket port 5025), 54-63 (commands), 73 (USBTMC example 0xF4EC:0x1300)"}
  - {note: "Pacing taken over from the SPD3303X (EEVblog, Kurokesu siglent_psu_api); a user waited 2 s after OUTP ON"}
models:
  - name: SPD1168X
    match: "^Siglent( Technologies)?, ?SPD1168X,"
    features: {PSU: {absolute_limits: {voltage: {unit: V, max: 16.0}, current: {unit: A, max: 8.0}, power: {unit: W, max: 128.0}}}}
  - name: SPD1305X
    match: "^Siglent( Technologies)?, ?SPD1305X,"
    features: {PSU: {absolute_limits: {voltage: {unit: V, max: 30.0}, current: {unit: A, max: 5.0}, power: {unit: W, max: 150.0}}}}
link:
  usbtmc:
    vid: "f4ec"
    pid: "1300"
    framing:
      tx: {terminator: "\n"}
      rx: {mode: message, strip_trailing: "\n", timeout_ms: 1000}
      timing: {min_gap_ms: 150, gap_after_write_ms: 300}
  tcp: {port: 5025}
commands:
  idn: {source: "p.54 ('Siglent, SPD1168X, SPD1XDAD1R0001, 2.01.01.06, V1.0')"}
  meas_v: {source: "p.55 (MEASure:VOLTage? CH1 -> 16.000)"}
  meas_i: {source: "p.55 (MEASure:CURRent? CH1 -> 3.000)"}
  meas_p: {send: "MEAS:POWE? CH{ch}", parse: [trim, number], source: "p.55-56 (MEASure:POWEr? CH1 -> 90.000)"}
  volt_q: {source: "p.56 (CH1:VOLTage? -> 15.000)"}
  curr_q: {source: "p.56 (CH1:CURRent? -> 0.500)"}
  volt_set: {params: {v: {max: 30}}, source: "p.56 (CH1:VOLTage 15)"}
  curr_set: {params: {a: {max: 8}}, source: "p.56 (CH1:CURRent 0.5)"}
  ovp_q: {send: "OVP?", parse: [trim, number], source: "p.56 (OVP? -> 16.000)"}
  ocp_q: {send: "OCP?", parse: [trim, number], source: "p.57 (OCP? -> 5.000)"}
  ovp_set:
    send: "OVP {v}"
    params: {v: {type: number, min: 0, max: 33, format: "%.3f", unit: V}}
    reply: none
    safety: configure
    description: "OVP level; protection is always armed (no enable command)"
    source: "p.56 (OVP 16)"
  ocp_set:
    send: "OCP {a}"
    params: {a: {type: number, min: 0, max: 8.5, format: "%.3f", unit: A}}
    reply: none
    safety: configure
    description: "OCP level; protection is always armed (no enable command)"
    source: "p.57 (OCP 5)"
  outp_set: {source: "p.58 (OUTPut CH1,ON)"}
  lock_set: {source: "p.63 (*LOCK / *UNLOCK)"}
  stat:
    parse:
      - trim
      - bits: {cc: "0", on: "4", four_wire: "5"}
    description: "bit0 CC(1)/CV(0), bit4 output on, bit5 4-wire sense"
    source: "p.59-60 (0x0224)"
classes:
  PSU:
    channels: 1
    features:
      lock: true
      absolute_limits: {voltage: {unit: V, max: 30.0}, current: {unit: A, max: 8.0}, power: {unit: W, max: 150.0}}
    poll:
      - every_ms: 1000
        read: [meas_v, meas_i, meas_p, stat]
    status:
      VOUT: {expr: meas_v, as: si}
      IOUT: {expr: meas_i, as: si}
      POUT: {expr: meas_p, as: si}
      OUTPUT: 'stat.on ? "ON" : "OFF"'
      REMOTE: state.locked
      CV: "stat.on && !stat.cc"
      CC: "stat.on && stat.cc"
      SBY: "!stat.on"
    operations:
      voltage_limit: {get: ovp_q, set: ovp_set, as: si}
      current_limit: {get: ocp_q, set: ocp_set, as: si}
      output_power: {get: meas_p, as: si}
