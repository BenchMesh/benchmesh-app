# Generated once from the Python manifest + hand-authored protocol description;
# this file is now the source of truth. See ai_context/migration/device-notes/tenma_72.md.
schema: benchmesh.device/v1
id: tenma_72
vendor: TENMA
family: 72-series programmable DC power supply (Korad KA3005P protocol)
version: 1.0.0
sources:
  - {doc: "Series Protocol V2.0 of Remote Control", pages: "1-2"}
  - {doc: "TENMA 72-2540 User Manual", pages: "3-9"}
  - {capture: captures/20261016-201609, note: "read-only"}
  - {capture: captures/20261016-203514, note: "setters"}
  - {note: "Bench probe 2026-10-16: replies in 30-45 ms; queries need no gap; setters need >= 50 ms; 3-decimal VSET and exponent forms are silently ignored"}
models:
  - {"name": "72-2535", "match": "^TENMA 72\\-2535( |$)", "features": {"PSU": {"absolute_limits": {"current": {"unit": "A", "max": 3.0}, "power": {"unit": "W", "max": 90.0}}}}}
  - {"name": "72-2540", "match": "^TENMA 72\\-2540( |$)", "support": "tested"}
  - {"name": "72-2545", "match": "^TENMA 72\\-2545( |$)", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 2.0}, "power": {"unit": "W", "max": 120.0}}}}}
  - {"name": "72-2550", "match": "^TENMA 72\\-2550( |$)", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 3.0}, "power": {"unit": "W", "max": 180.0}}}}}
  - {"name": "72-2705", "match": "^TENMA 72\\-2705( |$)", "features": {"PSU": {"absolute_limits": {"current": {"unit": "A", "max": 3.0}, "power": {"unit": "W", "max": 90.0}}}}}
  - {"name": "72-2710", "match": "^TENMA 72\\-2710( |$)"}
  - {"name": "72-2930", "match": "^TENMA 72\\-2930( |$)", "features": {"PSU": {"absolute_limits": {"current": {"unit": "A", "max": 10.0}, "power": {"unit": "W", "max": 300.0}}}}}
  - {"name": "72-2940", "match": "^TENMA 72\\-2940( |$)", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "power": {"unit": "W", "max": 300.0}}}}}
  - {"name": "72-13320", "match": "^TENMA 72\\-13320( |$)", "features": {"PSU": {"absolute_limits": {"current": {"unit": "A", "max": 3.0}, "power": {"unit": "W", "max": 195.0}}}}, "channels": {"PSU": 3}, "note": "3-channel; channel addressing unverified"}
  - {"name": "72-13330", "match": "^TENMA 72\\-13330( |$)", "features": {"PSU": {"absolute_limits": {"power": {"unit": "W", "max": 315.0}}}}, "channels": {"PSU": 3}, "note": "3-channel; channel addressing unverified"}
  - {"name": "72-13360", "match": "^TENMA 72\\-13360( |$)", "features": {"PSU": {"absolute_limits": {"voltage": {"unit": "V", "max": 60.0}, "current": {"unit": "A", "max": 15.0}, "power": {"unit": "W", "max": 300.0}}}}}
identify: idn
link:
  serial: {baud: 9600, format: 8N1, flow: none, dtr: low, rts: low, settle_ms: 50}
framing:
  tx: {terminator: ""}
  # No terminators: replies have fixed widths per command (reply: {bytes: N});
  # anything without a known width (IDN) ends after 15 ms of silence (~15 byte times).
  rx: {mode: idle, idle_ms: 15, timeout_ms: 300, drain_idle_ms: 20}
  timing: {min_gap_ms: 0, gap_after_write_ms: 50}
commands:
  idn:
    send: "*IDN?"
    parse: [trim]
    source: protocol p.2 #10
  vout:
    send: "VOUT{ch}?"
    reply: {bytes: 5}
    parse: [trim, number]
    description: Measured output voltage (V), 0 while output is off
    source: protocol p.1 #6
  iout:
    send: "IOUT{ch}?"
    reply: {bytes: 5}
    parse: [trim, number]
    source: protocol p.1 #5
  vset_q:
    send: "VSET{ch}?"
    reply: {bytes: 5}
    parse: [trim, number]
    source: protocol p.1 #4
  iset_q:
    send: "ISET{ch}?"
    reply: {bytes: 6}  # 6 bytes: trailing space, e.g. "0.988 "
    parse: [trim, number]
    source: protocol p.1 #2
  status:
    send: "STATUS?"
    reply: {bytes: 1}
    parse:
      - byte
      - bits: {ch1_cv: "0", ch2_cv: "1", tracking: "2..3", beep: "4", bit5: "5", out: "6"}
    description: bit0 is only meaningful while the output is on (latched otherwise); bit5 polarity unverified
    source: protocol p.2 #9
  vset:
    send: "VSET{ch}:{v}"
    params:
      v: {type: number, min: 0, max: 60, format: "%.2f", unit: V}
    reply: none
    safety: configure
    description: Max 2 decimals; anything else is silently ignored by the device
    source: protocol p.1 #3
  iset:
    send: "ISET{ch}:{i}"
    params:
      i: {type: number, min: 0, max: 15, format: "%.3f", unit: A}
    reply: none
    safety: configure
    source: protocol p.1 #1
  output:
    send: "OUT{on}"
    params:
      on: {type: enum, values: {"ON": "1", "OFF": "0"}}
    reply: none
    safety: energize
    description: Global (not per channel)
    source: protocol p.2 #8
  ocp:
    send: "OCP{on}"
    params:
      on: {type: enum, values: {"ON": "1", "OFF": "0"}}
    reply: none
    safety: configure
    description: Never exercised (Python bug); reply/timing unverified
    source: protocol p.2 #13
  ovp:
    send: "OVP{on}"
    params:
      on: {type: enum, values: {"ON": "1", "OFF": "0"}}
    reply: none
    safety: configure
    description: Never exercised (Python bug); reply/timing unverified
    source: protocol p.2 #14
classes:
  PSU:
    channels: 1
    ui_component: GenericPSU
    features: {"lock": true, "auto_lock": true, "compulsory_lock": false, "memory_banks": 5, "memory_storage": ["V", "A"], "absolute_limits": {"voltage": {"unit": "V", "max": 30.0}, "current": {"unit": "A", "max": 5.0}, "power": {"unit": "W", "max": 150.0}}, "protection": {"OCP": {"type": "boolean"}, "OVP": {"type": "boolean"}}}
    poll:
      - every_ms: 250
        read: [vout, iout, status]
    status:
      VOUT: {expr: vout, as: si}
      IOUT: {expr: iout, as: si}
      POUT: {expr: "vout * iout", as: si}
      OUTPUT: 'status.out ? "ON" : "OFF"'
      REMOTE: '"ON"'  # USB connection puts the unit in remote (manual p.8); no command exists
      CV: "status.out && status.ch1_cv"
      CC: "status.out && !status.ch1_cv"
      SBY: "!status.out"
    operations:
      voltage: {get: vset_q, set: vset, as: si}
      current: {get: iset_q, set: iset, as: si}
      output: {set: output}
      ovp: {set: ovp}
      ocp: {set: ocp}
      output_voltage: {get: vout, as: si}
      output_current: {get: iout, as: si}
