# Tonghui TH28xx LCR meters (E4980 dialect). Written from the TH2810B+/TH2817B+ operation manual
# (Chinese, v1.1, command reference ch. 7); TH2830/TH2832/TH2838 use the same Tonghui SCPI tree
# (assumed, not documented here). B&K Precision 894/895 (Tonghui OEM) have their own definition
# (bk_894). See ai_context/migration/coverage/LCR.md §2.3.
schema: benchmesh.device/v1
id: tonghui_th28xx
extends: scpi_lcr_e4980
vendor: Tonghui
family: TH28xx LCR meter
version: 0.1.0
sources:
  - {doc: "TH2810B+_TH2817B+_operation_manual_cn_v1.1.pdf (BenchMeshDOC/tonghui_th28xx)", pages: "60-62 (interface), 89-106 (SCPI), 115 (*IDN?)"}
  - {note: "Interface must be set to protocol SCPI (not MODBUS / TH2810B legacy) on the instrument; baud selectable 9600-115200 (9600 assumed here)"}
models:
  - name: TH2817B+
    match: '(?i)^tonghui,\s*TH2817B\+'
    features: {LCR: {frequency: {min: 50, max: 100000, presets: [100, 120, 1000, 10000, 100000]}, level: {min: 0.1, max: 1}}}
  - name: TH2810B+
    match: '(?i)^tonghui,\s*TH2810B\+'
    features: {LCR: {frequency: {min: 50, max: 10000, presets: [100, 120, 1000, 10000]}, level: {min: 0.1, max: 1}}}
  - name: TH2830
    match: '(?i)^tonghui,\s*TH2830'
    note: "Not documented here: same Tonghui command tree assumed"
    features: {LCR: {frequency: {min: 50, max: 100000, presets: [100, 120, 1000, 10000, 100000]}, level: {min: 0.1, max: 1}}}
  - name: TH2832
    match: '(?i)^tonghui,\s*TH2832'
    note: "Not documented here: same Tonghui command tree assumed; limits to confirm"
    features: {LCR: {frequency: {min: 20, max: 200000, presets: [100, 120, 1000, 10000, 100000]}, level: {min: 0.01, max: 2}}}
  - name: TH2838
    match: '(?i)^tonghui,\s*TH2838'
    note: "Not documented here: same Tonghui command tree assumed; limits to confirm"
    features: {LCR: {frequency: {min: 20, max: 2000000, presets: [100, 1000, 10000, 100000, 1000000]}, level: {min: 0.005, max: 2}}}
link:
  serial: {baud: 9600, format: 8N1}
  usbtmc:
    framing:
      tx: {terminator: "\n"}
      rx: {mode: message, strip_trailing: "\n", timeout_ms: 1000}
      timing: {min_gap_ms: 20, gap_after_write_ms: 50}
commands:
  # Tonghui extras Rp-Q, Rs-Q, Z-Q (UM p.93-94); range 3 ohm (UM p.94)
  func_set:
    params: {f: {values: {RPQ: RPQ, RSQ: RSQ, ZQ: ZQ}}}
  rang_set:
    params: {r: {values: {"3": "FUNC:IMP:RANG 3"}}}
classes:
  LCR:
    features:
      functions:
        RPQ: {primary: Rp, secondary: Q, circuit: PAR, units: ["Ω", ""], ui_name: "Rp-Q"}
        RSQ: {primary: Rs, secondary: Q, circuit: SER, units: ["Ω", ""], ui_name: "Rs-Q"}
        ZQ:  {primary: Z,  secondary: Q, units: ["Ω", ""], ui_name: "Z-Q"}
      ranges:
        - {value: AUTO, display: AUTO}
        - {value: "3", display: "3 Ω"}
        - {value: "10", display: "10 Ω"}
        - {value: "30", display: "30 Ω"}
        - {value: "100", display: "100 Ω"}
        - {value: "300", display: "300 Ω"}
        - {value: "1000", display: "1 kΩ"}
        - {value: "3000", display: "3 kΩ"}
        - {value: "10000", display: "10 kΩ"}
        - {value: "30000", display: "30 kΩ"}
        - {value: "100000", display: "100 kΩ"}
