# UNI-T UTG4000A series function/arbitrary waveform generators (UTG4082A … UTG4202A).
# Written from the programming manual before anyone tested it on hardware.
# Research: ai_context/migration/coverage/AWG.md §2.5. PM = UTG4000A Programming Manual V1.0 (PDF pages).
schema: benchmesh.device/v1
id: unit_utg4000a
extends: unit_utg
vendor: UNI-T
family: UTG4000A series function/arbitrary waveform generator
version: 0.1.0
sources:
  - {doc: "UTG4000A Programming Manual V1.0 (UTG4000A_Programming_Manual_V1.0.pdf, June 2023, SW V1.23.07)", pages: "5 (*IDN?), 9 (OUTPut), 11 (AMPLitude:UNIT, LOAD), 13 (BASE:WAVe, FREQuency), 14 (PHASe, AMPLitude, OFFSet), 16 (RAMP:SYMMetry)"}
  - {note: "Limits: AWG.md §2.5 (80…200 MHz sine; model list from the product page, unverified). The *IDN? model field is the family (UTG4000). LAN: the manual shows VXI-11 only (TCPIP0::<ip>::inst0::INSTR, no raw socket port), so no tcp link; USB id undocumented (the manual's 0x5345::0x1234 is a placeholder)"}
models:
  - {"name": "UTG4082A", "match": "^UNI-T Technologies, ?UTG4082A,", "features": {"AWG": {"max_freq_hz": {"SIN": 80e6}}}}
  - {"name": "UTG4122A", "match": "^UNI-T Technologies, ?UTG4122A,", "features": {"AWG": {"max_freq_hz": {"SIN": 120e6}}}}
  - {"name": "UTG4162A", "match": "^UNI-T Technologies, ?UTG4162A,", "features": {"AWG": {"max_freq_hz": {"SIN": 160e6}}}}
  - {"name": "UTG4202A", "match": "^UNI-T Technologies, ?UTG4202A,", "features": {"AWG": {"max_freq_hz": {"SIN": 200e6}}}}
  - {"name": "UTG4000A", "match": "^UNI-T Technologies, ?UTG4[0-9]{3}A?,", "note": "IDN reports the family (UTG4000); limits of the largest model (UTG4202A)"}
link:
  # LAN: VXI-11 (LXI; no raw socket) — uses the top-level message framing
  vxi11: {}
commands:
  shape_q: {source: "PM p13; reply SINe (also HARMonic → ARB)"}
  shape_set: {source: "PM p13"}
  freq_q: {source: "PM p13; reply 2e+3"}
  freq_set:
    params: {hz: {type: number, min: 0.000001, max: 200000000, format: "%.6f", unit: Hz}}
    source: "PM p13"
  unit_q: {source: "PM p11; reply VPP"}
  ampl_q: {source: "PM p14; reply 2e+0"}
  ampl_set: {source: "PM p14; 1 mVpp to load·20/(50+load)"}
  offs_q: {source: "PM p14; reply 2e+0"}
  offs_set: {source: "PM p14"}
  phase_q: {source: "PM p14; reply 2e1"}
  phase_set: {source: "PM p14; -360…360°"}
  symm_q: {source: "PM p16; reply 20"}
  symm_set: {source: "PM p16"}
  load_q: {source: "PM p11; 1…10000 Ω, 10000 = High-Z; reply 50e+0"}
classes:
  AWG:
    features: {"max_freq_hz": {"SIN": 200e6}}
