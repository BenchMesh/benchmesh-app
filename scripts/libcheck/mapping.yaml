# BenchMesh definition id -> library instrument classes whose protocol test vectors exercise the
# same wire dialect. Read by crates/bm-driver/examples/crosscheck.rs; the vectors themselves live
# outside the repository (BenchMeshDOC/_vectors/<library>/<instrument_class>.json, extract.py).
#
#   <definition id>:
#     transport: usbtmc | serial | tcp     # whose framing strips the vector replies
#     vectors: {<library>: [<instrument_class>, ...]}
#     note: why the classes match (models, dialect caveats)
#
# Libraries: pymeasure (MIT, expected_protocol tests), qcodes (MIT, pyvisa-sim YAML: replies are
# simulator defaults, not captures), instrumentkit (AGPLv3: facts only, nothing copied in).
# Full overlap matrix: ai_context/migration/coverage/LIBRARIES.md.

# ---- pilot families
keysight_33500b:
  transport: usbtmc
  vectors: {pymeasure: [Agilent33500], qcodes: [Keysight_33xxx]}
  note: "PyMeasure Agilent33500 covers 33500B/33600A; QCoDeS Keysight_33xxx sim (33511B/33522B/33622A)"
rigol_dg800:
  transport: usbtmc
  vectors: {pymeasure: [DG800]}
  note: "PyMeasure rigol.DG800 (DG800/DG900 dialect)"
siglent_spd1000x:
  transport: usbtmc
  vectors: {pymeasure: [SPD1168X, SPD1305X]}
  note: "PyMeasure siglenttechnologies SPD1168X / SPD1305X (single-channel SPD1000X series)"
keithley_dmm6500:
  transport: usbtmc
  vectors: {pymeasure: [KeithleyDMM6500]}
  note: "PyMeasure keithley.KeithleyDMM6500 (SCPI command set, not TSP)"

